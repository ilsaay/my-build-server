name: Setup PHP 7.2 Windows (Prebuilt)

on:
  workflow_dispatch:

jobs:
  setup-php72:
    runs-on: windows-2022

    steps:
      - name: Download PHP 7.2 Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://windows.php.net/downloads/releases/archives/php-7.2.34-Win32-VC15-x64.zip" -OutFile "php72.zip"
          Expand-Archive php72.zip -DestinationPath C:\php72

      - name: Harden php.ini
        shell: pwsh
        run: |
          Copy-Item C:\php72\php.ini-production C:\php72\php.ini
          Add-Content C:\php72\php.ini @"
          expose_php = Off
          display_errors = Off
          allow_url_fopen = Off
          allow_url_include = Off
          disable_functions = exec,passthru,shell_exec,system,proc_open,popen,eval,assert
          "@

      - name: Verify
        shell: pwsh
        run: |
          C:\php72\php.exe -v
          C:\php72\php.exe -m
