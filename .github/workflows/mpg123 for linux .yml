name: Build mpg123 1.25.13 Linux x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential make wget xz-utils pkg-config libasound2-dev file

      - name: Download source
        run: |
          wget https://www.mpg123.de/download/mpg123-1.25.13.tar.bz2
          tar xjf mpg123-1.25.13.tar.bz2

      - name: Configure
        run: |
          cd mpg123-1.25.13
          ./configure --host=x86_64-linux-gnu --build=x86_64-linux-gnu --disable-static --enable-shared --disable-network --disable-ipv6 --with-cpu=generic --with-audio=alsa --with-default-audio=alsa --disable-lfs CFLAGS="-O2 -s" LDFLAGS=""

      - name: Build
        run: |
          cd mpg123-1.25.13
          make -j$(nproc)

      - name: Check
        run: |
          echo "=== main binary ==="
          file mpg123-1.25.13/src/.libs/mpg123 || true
          echo "=== output modules ==="
          ls -la mpg123-1.25.13/src/libout123/modules/.libs/ || true
          echo "=== libmpg123 ==="
          ls -la mpg123-1.25.13/src/libmpg123/.libs/ || true
          echo "=== libout123 ==="
          ls -la mpg123-1.25.13/src/libout123/.libs/ || true
          echo "=== libsyn123 ==="
          ls -la mpg123-1.25.13/src/libsyn123/.libs/ 2>/dev/null || echo "no libsyn123"

      - name: Collect
        run: |
          mkdir -p artifacts
          cp mpg123-1.25.13/src/.libs/mpg123 artifacts/mpg123
          cp mpg123-1.25.13/src/libmpg123/.libs/libmpg123.so* artifacts/ 2>/dev/null || true
          cp mpg123-1.25.13/src/libout123/.libs/libout123.so* artifacts/ 2>/dev/null || true
          cp mpg123-1.25.13/src/libsyn123/.libs/libsyn123.so* artifacts/ 2>/dev/null || true
          cp mpg123-1.25.13/src/libout123/modules/.libs/output_*.so artifacts/
          printf '%s\n' '#!/bin/sh' 'DIR=$(cd "$(dirname "$0")" && pwd)' 'export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"' 'export MPG123_MODDIR="$DIR"' 'exec "$DIR/mpg123" "$@"' > artifacts/run.sh
          chmod +x artifacts/run.sh
          echo "=== artifacts ==="
          ls -la artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mpg123-1.25.13-linux-x86_64
          path: artifacts/
