name: Send 126 Email

on:
  workflow_dispatch:

jobs:
  send-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Send Email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.126.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}

          subject: "GitHub Actions 测试邮件"

          body: |
            你好！

            这是一封由 GitHub Actions
            通过 126 邮箱 SMTP 自动发送的邮件。

            邮件正文可以直接在这里修改。
