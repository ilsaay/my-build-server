# Build GNU Emacs 28.2 — Windows x64 GUI, 无遥测, 稳定优先
#
# 版本选择: Emacs 28.2 (2022-09, 28 系列最后一个正式版)
#   - 经过 3 年以上长期验证, Windows GUI 构建路径最成熟
#   - 没有 29+ 的 tree-sitter、31 的新特性带来的不稳定因素
#   - 自带 native-comp 框架, 但本 workflow 明确关掉, 见下
#
# 去遥测说明 (先说清楚, 免得误会):
#   Emacs 上游本身就没有遥测、没有使用统计、没有崩溃上报、没有联网打点,
#   package.el 只在用户主动装包时才联网。本 workflow 额外做到:
#     - 不开 native-compilation (不用 libgccjit, 避免 JIT 编译不稳定/启动慢)
#     - --without-dbus --without-imagemagick (Windows 上不支持/不稳定, 且会拉外部依赖)
#     - 不装、不启用任何第三方遥测/统计包, 不加任何 post-install 脚本
#     - 只用官方 ftp.gnu.org 的 release tarball, 不用 git master / 快照版
#
# 稳定优先的取舍:
#   - CFLAGS 只用 -O2 + -march=x86-64 通用指令集, 不用 -O3, 不用 -march=native
#     (GitHub Runner 的 CPU 和你的 CPU 不一样, -march=native 编出来的二进制
#      在你机器上可能跑不了 / 不稳定)
#   - Runner 用 windows-2022 (比 windows-latest 更稳, 28.2 时代的工具链)
#   - MSYS2 用 MINGW64 (MSVCRT), 不是 UCRT64 (UCRT 是 29+ / Emacs 31 的路子,
#     28.2 用 MINGW64 最稳)
#   - make 只用 -j4, 不用满核, 避免 CI 上 OOM / 编译随机失败
#   - 只保留 GUI 必需 + 常用库: GnuTLS(联网装包用)、libxml2、图片库(xpm/png/jpeg/gif/tiff/rsvg)
#
# 使用方法:
#   1. 把本文件放进你的 GitHub 仓库: .github/workflows/build-emacs-28.2-windows-gui.yml
#   2. GitHub 网页: Actions -> Build GNU Emacs 28.2 Windows GUI -> Run workflow
#   3. 跑完在 Artifacts 里下载 emacs-28.2-windows-x64-gui.zip
#   4. 解压到任意目录 (如 D:\emacs-28.2), 双击 bin\runemacs.exe 即图形界面
#      不需要装 MSYS2, 所需 DLL 已随包一起打进去
#
name: Build GNU Emacs 28.2 Windows GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    env:
      EMACS_VERSION: "28.2"
      # 稳定优先: -O2, 通用 x86-64, 不开 -O3 / -march=native / LTO
      CFLAGS: "-O2 -march=x86-64 -mtune=generic -pipe"
      CXXFLAGS: "-O2 -march=x86-64 -mtune=generic -pipe"
      LDFLAGS: "-Wl,--no-undefined"

    steps:
      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # 只装必需的: 编译工具链 + GUI/图片/TLS 库
          # 不装: libgccjit (native-comp)、imagemagick、dbus、tree-sitter
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-xpm-nox
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-giflib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-zlib
            texinfo

      - name: Download Emacs 28.2 release tarball
        run: |
          set -e
          curl -fL -o emacs-${EMACS_VERSION}.tar.xz \
            "https://ftp.gnu.org/gnu/emacs/emacs-${EMACS_VERSION}.tar.xz"
          ls -lh emacs-${EMACS_VERSION}.tar.xz
          tar -xf emacs-${EMACS_VERSION}.tar.xz
          ls emacs-${EMACS_VERSION}/nt/INSTALL.W64

      - name: Configure (Windows GUI, 无遥测, 稳定优先)
        working-directory: emacs-${{ env.EMACS_VERSION }}
        run: |
          set -e
          ./configure \
            --prefix=/c/emacs-${EMACS_VERSION} \
            --with-gnutls \
            --with-xpm \
            --with-jpeg \
            --with-png \
            --with-gif \
            --with-tiff \
            --with-rsvg \
            --with-xml2 \
            --with-zlib \
            --without-dbus \
            --without-imagemagick \
            --without-native-compilation \
            --without-compress-install
          # 注意: 28.2 没有 tree-sitter 选项, 不用加 --without-tree-sitter,
          # 加了 configure 会报 unrecognized option

      - name: Build
        working-directory: emacs-${{ env.EMACS_VERSION }}
        run: |
          set -e
          make -j4
          make install prefix=/c/emacs-${EMACS_VERSION}

      - name: Smoke test (batch 模式, 不开 GUI)
        run: |
          set -e
          /c/emacs-${EMACS_VERSION}/bin/emacs.exe --version
          /c/emacs-${EMACS_VERSION}/bin/emacs.exe --batch \
            --eval "(progn (print emacs-version) (print (featurep 'gnutls)) (print window-system))"

      - name: Collect runtime DLLs
        run: |
          set -e
          # 只拷 emacs.exe 实际依赖的 MinGW64 DLL, 不把整个 mingw64/bin 打进去
          cd /c/emacs-${EMACS_VERSION}/bin
          for dll in $(ldd emacs.exe | grep -o '/mingw64/bin/[^ ]*\.dll'); do
            cp -v "$dll" . || true
          done
          ls -lh

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:EMACS_VERSION
          $src = "C:\emacs-$ver"
          $zip = "emacs-$ver-windows-x64-gui.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-28.2-windows-x64-gui
          path: emacs-28.2-windows-x64-gui.zip
          if-no-files-found: error
          retention-days: 30
