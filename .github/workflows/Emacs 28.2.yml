# Build GNU Emacs 31.1 — Windows x64 GUI, 无遥测, 稳定优先
#
# 为什么换成 31.1, 不再修 28.2:
#   28.2 (2022-09) 跟现在 MSYS2 / GCC 15 / 新 mingw-w64 头文件已经
#   系统性不兼容, 打补丁是打地鼠:
#     1. pkg-config 缺失 -> configure 找不到 gnutls (已修, 是真缺包)
#     2. _lseek 类型冲突 (2025-11 mingw-w64 改头文件, 上游 workaround)
#     3. emacsclient.c: FARPROC 带参调用, GCC 15 直接报错 (Bug#78160, 上游修在 30/master)
#     4. src/sysdep.c: waitpid / WNOHANG 未声明 — GCC 15 起隐式函数声明是硬错误,
#        28.2 的 syswait.h / config.h 链在新头文件下断了
#   第 4 个修完还会有第 5 个 (老式 K&R 写法、C23 严格性), 没法一次性修完。
#   31.1 (2026-08-24, 最新正式版) 是在 GCC 15 / 新 mingw-w64 环境下开发、
#   发布的, 上面这些修复都在上游里, 不用打任何源码补丁。
#   31.1_1 官方 Windows 包 (2026-09-17) 同时有 MSVCRT 版和 UCRT64 版,
#   证明 UCRT64 构建是官方走通的路子, 本 workflow 就用 UCRT64。
#
# 版本选择: Emacs 31.1 (2026-08-24)
#   - 官方 ftp.gnu.org release tarball, 不用 git master / 快照版
#   - 已在新工具链下验证过的版本, 不是“追新”, 是“能一次编过”的版本
#
# 去遥测说明:
#   Emacs 上游本身就没有遥测、没有使用统计、没有崩溃上报、没有联网打点,
#   package.el 只在用户主动装包时才联网。本 workflow 额外做到:
#     - 不开 native-compilation (不用 libgccjit, 避免 JIT 不稳定/启动慢)
#     - --without-dbus --without-imagemagick --without-tree-sitter
#     - 不装、不启用任何第三方遥测/统计包, 不加任何 post-install 脚本
#
# 稳定优先的取舍:
#   - CFLAGS 只用 -O2 + -march=x86-64 通用指令集, 不用 -O3, 不用 -march=native
#   - Runner 用 windows-2022
#   - MSYS2 用 UCRT64 (31.1 的官方推荐路子, 见上面)
#   - make 只用 -j4, 不用满核, 避免 CI 上 OOM / 编译随机失败
#   - 只保留 GUI 必需 + 常用库: GnuTLS、libxml2、jansson(JSON)、gmp、图片库
#
# 使用方法:
#   1. 把本文件放进你的 GitHub 仓库: .github/workflows/build-emacs-31.1-windows-gui.yml
#      (注意: 旧的 build-emacs-28.2-windows-gui.yml 不用再跑了, 可以删掉)
#   2. GitHub 网页: Actions -> Build GNU Emacs 31.1 Windows GUI -> Run workflow
#   3. 跑完在 Artifacts 里下载 emacs-31.1-windows-x64-gui.zip
#   4. 解压到任意目录 (如 D:\emacs-31.1), 双击 bin\runemacs.exe 即图形界面
#      不需要装 MSYS2, 所需 DLL 已随包一起打进去
#
name: Build GNU Emacs 31.1 Windows GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    env:
      EMACS_VERSION: "31.1"
      # 稳定优先: -O2, 通用 x86-64, 不开 -O3 / -march=native / LTO
      CFLAGS: "-O2 -march=x86-64 -mtune=generic -pipe"
      CXXFLAGS: "-O2 -march=x86-64 -mtune=generic -pipe"
      LDFLAGS: "-Wl,--no-undefined"

    steps:
      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # 只装必需的: 编译工具链 + GUI/图片/TLS/JSON 库
          # 不装: libgccjit (native-comp)、imagemagick、dbus、tree-sitter
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-xpm-nox
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-giflib
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-gnutls
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-pkgconf
            pkgconf
            texinfo

      - name: Download Emacs 31.1 release tarball
        run: |
          set -e
          curl -fL -o emacs-${EMACS_VERSION}.tar.xz \
            "https://ftp.gnu.org/gnu/emacs/emacs-${EMACS_VERSION}.tar.xz"
          ls -lh emacs-${EMACS_VERSION}.tar.xz
          tar -xf emacs-${EMACS_VERSION}.tar.xz
          ls emacs-${EMACS_VERSION}/nt/INSTALL.W64

      # 注意: 31.1 不用打任何源码补丁 (_lseek / emacsclient / waitpid 的修复
      # 都在上游里)。下面只有 pkg-config 的检查, 那是真缺包问题, 不是补丁。

      - name: Configure (Windows GUI, 无遥测, 稳定优先)
        working-directory: emacs-${{ env.EMACS_VERSION }}
        run: |
          set -e
          # 必须有 pkg-config, 否则 configure 找不到 gnutls/libxml2 等已装的库
          which pkg-config || which pkgconf
          pkg-config --modversion gnutls
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          ./configure \
            --prefix=/c/emacs-${EMACS_VERSION} \
            --with-gnutls \
            --with-xpm \
            --with-jpeg \
            --with-png \
            --with-gif \
            --with-tiff \
            --with-rsvg \
            --with-xml2 \
            --with-zlib \
            --with-json \
            --without-dbus \
            --without-imagemagick \
            --without-native-compilation \
            --without-tree-sitter \
            --without-compress-install

      - name: Build
        working-directory: emacs-${{ env.EMACS_VERSION }}
        run: |
          set -e
          make -j4
          make install prefix=/c/emacs-${EMACS_VERSION}

      - name: Smoke test (batch 模式, 不开 GUI)
        run: |
          set -e
          /c/emacs-${EMACS_VERSION}/bin/emacs.exe --version
          /c/emacs-${EMACS_VERSION}/bin/emacs.exe --batch \
            --eval "(progn (print emacs-version) (print (featurep 'gnutls)) (print window-system))"

      - name: Collect runtime DLLs
        run: |
          set -e
          # 只拷 emacs.exe 实际依赖的 UCRT64 DLL, 不把整个 ucrt64/bin 打进去
          cd /c/emacs-${EMACS_VERSION}/bin
          for dll in $(ldd emacs.exe | grep -o '/ucrt64/bin/[^ ]*\.dll'); do
            cp -v "$dll" . || true
          done
          ls -lh

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:EMACS_VERSION
          $src = "C:\emacs-$ver"
          $zip = "emacs-$ver-windows-x64-gui.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $src -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emacs-31.1-windows-x64-gui
          path: emacs-31.1-windows-x64-gui.zip
          if-no-files-found: error
          retention-days: 30
