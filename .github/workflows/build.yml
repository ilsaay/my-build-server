name: Build FFmpeg 4.0.0 for Windows x64 (Minimal)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-cross:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchain and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            yasm \
            nasm \
            cmake \
            git \
            pkg-config \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            mingw-w64-tools

      - name: Clone FFmpeg 4.0.0 source (tag n4.0)
        run: |
          git clone --branch n4.0 --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-4.0.0

      - name: Configure FFmpeg for Windows x64
        working-directory: ./ffmpeg-4.0.0
        run: |
          ./configure \
            --target-os=mingw32 \
            --arch=x86_64 \
            --cross-prefix=x86_64-w64-mingw32- \
            --pkg-config=pkg-config \
            --disable-everything \
            --disable-network \
            --disable-protocols \
            --enable-protocol=file \
            --disable-decoders \
            --enable-decoder=h264 \
            --enable-decoder=mp3 \
            --enable-decoder=mp2 \
            --enable-decoder=aac \
            --enable-decoder=wavpack \
            --enable-decoder=flac \
            --enable-decoder=pcm_s16le \
            --enable-decoder=pcm_s24le \
            --enable-decoder=pcm_f32le \
            --disable-encoders \
            --enable-encoder=h264 \
            --enable-encoder=mp3 \
            --enable-encoder=mp2 \
            --enable-encoder=aac \
            --enable-encoder=pcm_s16le \
            --enable-encoder=flac \
            --disable-demuxers \
            --enable-demuxer=h264 \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-demuxer=mpegts \
            --enable-demuxer=mp3 \
            --enable-demuxer=aac \
            --enable-demuxer=wav \
            --enable-demuxer=flac \
            --disable-muxers \
            --enable-muxer=h264 \
            --enable-muxer=mp4 \
            --enable-muxer=matroska \
            --enable-muxer=mpegts \
            --enable-muxer=mp3 \
            --enable-muxer=aac \
            --enable-muxer=wav \
            --enable-muxer=flac \
            --disable-parsers \
            --enable-parser=h264 \
            --enable-parser=mpegaudio \
            --enable-parser=aac \
            --enable-parser=flac \
            --disable-bsfs \
            --enable-bsf=h264_mp4toannexb \
            --disable-filters \
            --disable-avdevice \
            --disable-swscale \
            --disable-avfilter \
            --disable-postproc \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-runtime-cpudetect \
            --enable-pic \
            --enable-shared \
            --extra-cflags="-O2 -pipe" \
            --enable-gpl \
            --enable-nonfree \
            --enable-dxva2 \
            --enable-d3d11va

      - name: Build FFmpeg (Windows x64)
        working-directory: ./ffmpeg-4.0.0
        run: |
          make -j$(nproc)

      - name: Install to temporary directory
        working-directory: ./ffmpeg-4.0.0
        run: |
          make install DESTDIR=${{ github.workspace }}/ffmpeg-install

      - name: Upload Artifacts (Windows binaries)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-4.0.0-windows-x64
          path: ${{ github.workspace }}/ffmpeg-install/usr/local/bin/*.exe
