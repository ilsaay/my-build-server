name: Build GStreamer 1.18 (Slim)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout gst-build 1.18 branch
      uses: actions/checkout@v4
      with:
        repository: 'GStreamer/gst-build'
        ref: '1.18'

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip ninja-build pkg-config \
          libglib2.0-dev libx264-dev libvpx-dev libopus-dev \
          libvorbis-dev libssl-dev
        pip3 install meson

    - name: Configure build (Minimal)
      run: |
        meson setup builddir \
          -Dauto_features=disabled \
          -Dgstreamer:tools=enabled \
          -Dbad=enabled \
          -Dgst-plugins-bad:nvcodec=enabled

    - name: Build
      run: ninja -C builddir

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gstreamer-1.18-slim
        path: builddir/
