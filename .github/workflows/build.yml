name: Build TCC in Container

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04  # 使用容器指定版本
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y build-essential git wget
    
    - name: Clone TCC
      run: |
        git clone https://github.com/TinyCC/tinycc.git
        cd tinycc
        git checkout release_0_9_26
    
    - name: Configure
      run: |
        cd tinycc
        ./configure --prefix=$GITHUB_WORKSPACE/install
    
    - name: Build
      run: |
        cd tinycc
        make -j2
    
    - name: Install
      run: |
        cd tinycc
        make install
    
    - name: Test
      run: |
        echo 'int main(void) { return 0; }' > test.c
        $GITHUB_WORKSPACE/install/bin/tcc test.c -o test
        ./test && echo "Success!" || echo "Build OK, execution may fail"
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: tcc-0926
        path: $GITHUB_WORKSPACE/install
