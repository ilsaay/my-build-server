# .github/workflows/build-tcc.yml
name: Build TCC from Git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git
    
    - name: Clone TCC repository
      run: |
        git clone https://github.com/TinyCC/tinycc.git
        cd tinycc
        # 查看所有可用的历史版本
        git tag -l
    
    - name: Checkout old version
      run: |
        cd tinycc
        # 尝试不同的旧版本标签
        git checkout release_0_9_26 || \
        git checkout release_0_9_25 || \
        git checkout release_0_9_24 || \
        git checkout release_0_9_23
        git log --oneline -1
    
    - name: Configure
      run: |
        cd tinycc
        ./configure --prefix=$GITHUB_WORKSPACE/tcc-install
    
    - name: Build
      run: |
        cd tinycc
        make -j2
    
    - name: Install
      run: |
        cd tinycc
        make install
    
    - name: Test
      run: |
        $GITHUB_WORKSPACE/tcc-install/bin/tcc --version
        echo '#include <stdio.h>
        int main() { printf("TCC works!\n"); return 0; }' > test.c
        $GITHUB_WORKSPACE/tcc-install/bin/tcc test.c -o test
        ./test
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: tcc-from-git
        path: $GITHUB_WORKSPACE/tcc-install
