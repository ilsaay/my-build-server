name: Build DMD 1.076 Windows Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DMD 1.076 Windows
        shell: cmd
        run: |
          curl -L -o dmd.zip "https://downloads.dlang.org/releases/1.x/1.076/dmd.1.076.windows.zip"
          dir

      - name: Extract
        shell: cmd
        run: |
          mkdir dmd
          tar -xf dmd.zip -C dmd
          dir dmd

      - name: Remove non-Windows directories
        shell: cmd
        run: |
          cd dmd
          rmdir /S /Q freebsd 2>nul
          rmdir /S /Q linux 2>nul
          rmdir /S /Q osx 2>nul
          rmdir /S /Q html 2>nul
          rmdir /S /Q man 2>nul
          rmdir /S /Q samples 2>nul
          dir

      - name: Remove unnecessary files
        shell: cmd
        run: |
          cd dmd
          rmdir /S /Q windows\lib 2>nul
          rmdir /S /Q windows\src 2>nul
          dir windows

      - name: Upload DMD Lite
        uses: actions/upload-artifact@v4
        with:
          name: dmd-1.076-windows-lite
          path: dmd
