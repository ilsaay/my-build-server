name: Build Geany 1.24 Windows Portable (64-bit)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk2
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-pkg-config
            git
            wget
            unzip
            zip

      - name: Download Geany 1.24 source
        run: |
          cd $HOME
          wget https://download.geany.org/geany-1.24.1.tar.bz2 || \
          wget https://download.geany.org/geany-1.24.0.tar.bz2 || \
          wget https://github.com/geany/geany/archive/refs/tags/1.24.0.tar.gz
          # 解压（处理两种压缩格式）
          if [ -f geany-1.24.1.tar.bz2 ]; then
            tar xjf geany-1.24.1.tar.bz2
            mv geany-1.24.1 geany-1.24
          elif [ -f geany-1.24.0.tar.bz2 ]; then
            tar xjf geany-1.24.0.tar.bz2
            mv geany-1.24.0 geany-1.24
          elif [ -f 1.24.0.tar.gz ]; then
            tar xzf 1.24.0.tar.gz
            mv geany-1.24.0 geany-1.24
          fi

      - name: Autogen (if needed)
        run: |
          cd $HOME/geany-1.24
          if [ ! -f configure ]; then
            NOCONFIGURE=1 ./autogen.sh
          fi

      - name: Configure
        run: |
          cd $HOME/geany-1.24
          ./configure \
            --host=x86_64-w64-mingw32 \
            --build=x86_64-w64-mingw32 \
            --disable-static \
            --enable-shared \
            --disable-html-docs \
            --disable-pdf-docs \
            --disable-api-docs \
            --disable-socket \
            --disable-vte \
            CFLAGS="-O2"

      - name: Build
        run: |
          cd $HOME/geany-1.24
          make -j$(nproc)

      - name: Collect Portable Files
        shell: pwsh
        run: |
          $portable = "$env:USERPROFILE\portable"
          $geanySrc = "$env:USERPROFILE\geany-1.24"
          $msys2 = "C:\msys64\mingw64"   # 根据实际 MSYS2 安装路径调整

          New-Item -ItemType Directory -Force -Path $portable\bin, $portable\lib, $portable\share, $portable\etc

          # Geany 主程序
          Copy-Item "$geanySrc\src\geany.exe" $portable\bin\ -ErrorAction SilentlyContinue

          # Geany 数据文件
          Copy-Item "$geanySrc\data" $portable\share\geany -Recurse -ErrorAction SilentlyContinue

          # GTK2 DLL 和资源
          Copy-Item "$msys2\bin\*.dll" $portable\bin\ -ErrorAction SilentlyContinue
          Copy-Item "$msys2\etc" $portable\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$msys2\lib" $portable\ -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$msys2\share" $portable\ -Recurse -ErrorAction SilentlyContinue

          # 启动脚本
          @"
          @echo off
          cd /d "%~dp0"
          set PATH=%~dp0bin;%~dp0lib;%PATH%
          set GTK2_RC_FILES=%~dp0etc\gtk-2.0\gtkrc
          set GTK_EXE_PREFIX=%~dp0
          set GTK_DATA_PREFIX=%~dp0
          start "" "%~dp0bin\geany.exe" %*
          "@ | Out-File -FilePath "$portable\启动Geany.bat" -Encoding ASCII

          # 打包成 zip
          Compress-Archive -Path $portable\* -DestinationPath "$env:USERPROFILE\geany-1.24-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geany-1.24-windows-portable-x64
          path: ${{ env.USERPROFILE }}\geany-1.24-portable.zip
