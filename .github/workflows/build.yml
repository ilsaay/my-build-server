name: Build Geany Windows Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-autotools
            git
            zip

      - name: Checkout Geany
        run: |
          git clone --depth 1 https://github.com/geany/geany.git
          cd geany
          ./autogen.sh
          ./configure --prefix=$PWD/build
          make
          make install

      - name: Package portable exe
        run: |
          cd geany/build/bin
          zip -r geany-portable.zip geany.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: geany-portable-exe
          path: geany/build/bin/geany.exe
