name: Build Geany

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            intltool \
            pkg-config \
            libgtk-3-dev

      - name: Download Geany source
        run: |
          cd $HOME
          wget https://download.geany.org/geany-1.38.tar.gz
          tar xzf geany-1.38.tar.gz

      - name: Build Geany
        run: |
          cd $HOME/geany-1.38
          ./configure --disable-html-docs --disable-pdf-docs
          make -j2
