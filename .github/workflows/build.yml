name: Build CompCert for Windows

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360  # Coq 编译耗时很长，给足时间

    steps:
      - name: Checkout CompCert
        uses: actions/checkout@v4
        with:
          repository: AbsInt/CompCert
          ref: v3.13.1  # 稳定版本，支持 Cygwin 构建
          fetch-depth: 1

      - name: Set up Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: gcc make ocaml ocaml-findlib opam menhir
          install-dir: C:\tools\cygwin

      - name: Install Coq and dependencies via opam
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          opam init --disable-sandboxing -y
          opam switch create 4.14.0
          eval $(opam env)
          opam install coq.8.18.0 coq-flocq coq-menhirlib menhir -y

      - name: Configure CompCert for Cygwin
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          eval $(opam env)
          ./configure x86_64-cygwin -ignore-coq-version

      - name: Build CompCert
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          eval $(opam env)
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: compcert-windows
          path: ./ccomp
