name: Build GCC Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Verify
        run: |
          gcc --version
          gfortran --version

      - name: Build C (C89)
        run: |
          # 替换成你的 C 源文件
          gcc -std=c89 -pedantic -o hello_c.exe hello.c

      - name: Build Fortran
        run: |
          # 替换成你的 Fortran 源文件
          gfortran -o hello_f.exe hello.f90

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            *.exe
