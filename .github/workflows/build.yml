name: Build mruby Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # 改为 latest，更快分配
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ruby-full \
          bison \
          git \
          wget \
          mingw-w64 \
          zip
    
    - name: Download mruby
      run: |
        wget https://github.com/mruby/mruby/archive/refs/tags/1.4.0.tar.gz
        tar -xzf 1.4.0.tar.gz
        mv mruby-1.4.0 mruby
    
    - name: Create config
      run: |
        cd mruby
        cat > cross_config.rb << 'EOF'
        MRuby::CrossBuild.new('windows') do |conf|
          toolchain :gcc
          conf.cc.command = 'x86_64-w64-mingw32-gcc'
          conf.linker.command = 'x86_64-w64-mingw32-gcc'
          conf.archiver.command = 'x86_64-w64-mingw32-ar'
          conf.gembox 'default'
          conf.gem :core => 'mruby-bin-mruby'
          conf.gem :core => 'mruby-bin-mirb'
        end
        EOF
    
    - name: Build
      run: |
        cd mruby
        make MRUBY_CONFIG=cross_config.rb
    
    - name: Package
      run: |
        cd mruby
        mkdir -p ../mruby-win
        cp build/windows/bin/*.exe ../mruby-win/ 2>/dev/null || true
        cd ..
        zip -r mruby-win64.zip mruby-win/
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: mruby-windows
        path: mruby-win64.zip
