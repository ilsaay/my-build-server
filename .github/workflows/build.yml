# .github/workflows/build-mruby.yml
name: Build mruby 1.4.0 for Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          git \
          wget \
          mingw-w64 \
          zip \
          unzip \
          ruby        # 添加 Ruby
          bison       # 可能需要
    
    - name: Download mruby 1.4.0
      run: |
        wget https://github.com/mruby/mruby/archive/refs/tags/1.4.0.tar.gz
        tar -xzf 1.4.0.tar.gz
        cd mruby-1.4.0
    
    - name: Create Windows cross-compile config
      run: |
        cd mruby-1.4.0
        cat > build_config.rb << 'EOF'
        MRuby::CrossBuild.new('windows-x64') do |conf|
          toolchain :gcc
          
          conf.cc.command = 'x86_64-w64-mingw32-gcc'
          conf.linker.command = 'x86_64-w64-mingw32-gcc'
          conf.archiver.command = 'x86_64-w64-mingw32-ar'
          
          conf.gembox 'default'
          
          conf.gem :core => 'mruby-bin-mruby'
          conf.gem :core => 'mruby-bin-mirb'
          conf.gem :core => 'mruby-bin-strip'
        end
        EOF
    
    - name: Build mruby for Windows
      run: |
        cd mruby-1.4.0
        make MRUBY_CONFIG=build_config.rb
    
    - name: Verify Windows binaries
      run: |
        cd mruby-1.4.0
        find build -name "*.exe" -exec file {} \;
    
    - name: Package Windows binaries
      run: |
        cd mruby-1.4.0
        mkdir -p ../mruby-windows
        cp build/windows-x64/bin/*.exe ../mruby-windows/ 2>/dev/null || true
        cp -r build/windows-x64/lib ../mruby-windows/ 2>/dev/null || true
        cp -r include ../mruby-windows/ 2>/dev/null || true
        cd ..
        zip -r mruby-1.4.0-windows-x64.zip mruby-windows/
        ls -la mruby-1.4.0-windows-x64.zip
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mruby-1.4.0-windows
        path: mruby-1.4.0-windows-x64.zip
