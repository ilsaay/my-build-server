name: Build GCC from Source (Windows)

on:
  workflow_dispatch:

jobs:
  build-gcc:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2 with build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-mpc
            mingw-w64-ucrt-x86_64-isl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd
            wget
            tar

      - name: Download GCC source
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          wget https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz
          tar -xf gcc-14.2.0.tar.xz

      - name: Configure GCC (C + Fortran only)
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          mkdir build && cd build
          ../gcc-14.2.0/configure \
            --prefix=/ucrt64/gcc-custom \
            --enable-languages=c,fortran \
            --disable-bootstrap \
            --disable-multilib

      - name: Build GCC
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")/build"
          make -j$(nproc)

      - name: Install GCC
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")/build"
          make install

      - name: Package
        run: |
          cd /ucrt64/gcc-custom
          tar -czf "$(cygpath "$GITHUB_WORKSPACE")/gcc-custom-windows.tar.gz" .
