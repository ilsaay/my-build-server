name: Build C89 & Fortran

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Verify compilers
        run: |
          gcc --version
          gfortran --version

      - name: Build (C89 strict)
        run: |
          # 你的 C 代码编译命令，强制 C89 标准
          # gcc -std=c89 -pedantic -o myprogram.exe source.c

      - name: Build (Fortran)
        run: |
          # 你的 Fortran 代码编译命令
          # gfortran -o myprogram.exe source.f90
