name: Build GStreamer 1.18 for Windows x64 with MinGW

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Cerbero 1.18 branch
      uses: actions/checkout@v4
      with:
        repository: 'GStreamer/cerbero'
        ref: '1.18'

    - name: Setup MSYS2 with MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: |
          git
          make
          autoconf
          automake
          libtool
          pkg-config
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip
          mingw-w64-x86_64-python-virtualenv
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-nasm
          mingw-w64-x86_64-gettext
          mingw-w64-x86_64-glib2
          mingw-w64-x86_64-libffi
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-bzip2
          mingw-w64-x86_64-xz
          mingw-w64-x86_64-libsoup3
          mingw-w64-x86_64-libxml2
          mingw-w64-x86_64-curl
          mingw-w64-x86_64-openssl

    - name: Setup Python virtual environment
      shell: msys2 {0}
      run: |
        virtualenv cerbero-venv
        source cerbero-venv/bin/activate
        pip install --upgrade pip
        pip install setuptools wheel
        echo "CERBERO_VENV=$(pwd)/cerbero-venv" >> $GITHUB_ENV
        which python
        python --version

    - name: Bootstrap Cerbero
      shell: msys2 {0}
      run: |
        source $CERBERO_VENV/bin/activate
        python ./cerbero-uninstalled bootstrap -v

    - name: Build GStreamer 1.18 with MinGW
      shell: msys2 {0}
      run: |
        source $CERBERO_VENV/bin/activate
        python ./cerbero-uninstalled -c config/win64.cbc -v mingw package gstreamer-1.0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gstreamer-1.18-mingw-w64
        path: build/dist/
