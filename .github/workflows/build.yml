name: Get GStreamer 1.18 for Windows (MinGW)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  get-gst:
    runs-on: windows-latest

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: |
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad

      - name: Package GStreamer
        shell: msys2 {0}
        run: |
          mkdir -p dist/bin dist/lib
          # 复制核心动态库和工具
          cp /mingw64/bin/gst-* dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libgstreamer-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libgst*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libglib-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libgobject-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libgmodule-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libffi-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libintl-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libiconv-*.dll dist/bin/ 2>/dev/null || true
          cp /mingw64/bin/libpcre*.dll dist/bin/ 2>/dev/null || true
          # 复制插件
          cp /mingw64/lib/gstreamer-1.0/*.dll dist/lib/ 2>/dev/null || true
          # 打包
          zip -r gstreamer-1.18-mingw64.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-1.18-mingw64
          path: gstreamer-1.18-mingw64.zip
