name: Build FreeBSD 14.3 Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-freebsd:
    name: Build FreeBSD 14.3 amd64 Server
    runs-on: ubuntu-22.04

    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # REAL FREEBSD BUILD ENVIRONMENT
      #
      # release.sh MUST run inside FreeBSD.
      # It must NOT be executed directly on Ubuntu.
      # ============================================================
      - name: Build inside FreeBSD 14.3
        id: freebsd
        uses: vmactions/freebsd-vm@v1.2.4
        with:
          release: "14.3"
          arch: "amd64"

          mem: 8192
          cpu: 4

          usesh: true
          copyback: true

          prepare: |
            set -eux

            echo "========================================"
            echo " FreeBSD build environment"
            echo "========================================"

            freebsd-version
            uname -a
            sysctl -n hw.ncpu
            df -h

            echo
            echo "========================================"
            echo " Configure pkg"
            echo "========================================"

            # ------------------------------------------------------
            # FreeBSD 14.3 is EOL, while the FreeBSD:14 package
            # repository now contains packages built with a newer
            # OSVERSION.
            #
            # Allow pkg to use the FreeBSD:14 packages.
            # ------------------------------------------------------

            export IGNORE_OSVERSION=YES
            export ASSUME_ALWAYS_YES=yes

            echo "IGNORE_OSVERSION=$IGNORE_OSVERSION"
            echo "ASSUME_ALWAYS_YES=$ASSUME_ALWAYS_YES"

            echo
            echo "========================================"
            echo " Update pkg repository"
            echo "========================================"

            IGNORE_OSVERSION=YES \
            ASSUME_ALWAYS_YES=yes \
            pkg update -f

            echo
            echo "========================================"
            echo " Install build dependencies"
            echo "========================================"

            IGNORE_OSVERSION=YES \
            ASSUME_ALWAYS_YES=yes \
            pkg install -y \
              git \
              ca_root_nss \
              curl \
              wget \
              rsync \
              xz \
              sudo \
              bash \
              gmake

            echo
            echo "========================================"
            echo " Installed packages"
            echo "========================================"

            pkg info

            echo
            echo "========================================"
            echo " Prepare completed"
            echo "========================================"

          run: |
            set -eux

            echo "========================================"
            echo " FreeBSD version"
            echo "========================================"

            freebsd-version
            uname -a

            echo
            echo "CPU:"
            sysctl -n hw.ncpu

            echo
            echo "Disk:"
            df -h

            # ------------------------------------------------------
            # pkg environment
            # ------------------------------------------------------

            export IGNORE_OSVERSION=YES
            export ASSUME_ALWAYS_YES=yes

            # ------------------------------------------------------
            # Build directory
            # ------------------------------------------------------

            mkdir -p "$GITHUB_WORKSPACE/work"

            cd "$GITHUB_WORKSPACE/work"

            rm -rf src

            echo
            echo "========================================"
            echo " Download FreeBSD 14.3 source"
            echo "========================================"

            git clone \
              --depth 1 \
              --branch releng/14.3 \
              https://git.freebsd.org/src.git \
              src

            cd src

            echo
            echo "FreeBSD source revision:"
            git describe --always --dirty || true

            echo
            echo "========================================"
            echo " Create release.conf"
            echo "========================================"

            cat > "$GITHUB_WORKSPACE/work/release.conf" <<'EOF'
            # ========================================================
            # FreeBSD 14.3 Release Configuration
            # ========================================================

            # Release target
            TARGET="amd64"
            TARGET_ARCH="amd64"

            # Kernel
            KERNEL="GENERIC"

            # Source tree already exists
            NOGIT=1

            # Do not build ports tree
            NOPORTS=1

            # Do not include FreeBSD source
            NOSRC=1

            # Do not build documentation
            NODOC=1

            # Build VM images
            WITH_VMIMAGES=1

            # VM image formats
            VMFORMATS="raw qcow2"

            # VM disk size
            VMSIZE="20G"

            # Build parallelism
            WORLD_FLAGS="-j4"
            KERNEL_FLAGS="-j4"
            EOF

            echo
            echo "release.conf:"
            echo "----------------------------------------"
            cat "$GITHUB_WORKSPACE/work/release.conf"
            echo "----------------------------------------"

            echo
            echo "========================================"
            echo " Check release.sh"
            echo "========================================"

            /bin/sh -n release/release.sh

            echo "release.sh syntax OK"

            echo
            echo "========================================"
            echo " Start FreeBSD release build"
            echo "========================================"

            export MAKE_JOBS=4

            /bin/sh release/release.sh \
              -c "$GITHUB_WORKSPACE/work/release.conf"

            echo
            echo "========================================"
            echo " Release build finished"
            echo "========================================"

            echo
            echo "Searching for release files..."

            find "$GITHUB_WORKSPACE/work" \
              -type f \
              \( \
                -name "*.iso" \
                -o -name "*.img" \
                -o -name "*.qcow2" \
                -o -name "*.txz" \
                -o -name "MANIFEST" \
              \) \
              -print \
              | sort

            echo
            echo "========================================"
            echo " Create artifact directory"
            echo "========================================"

            mkdir -p "$GITHUB_WORKSPACE/work/artifacts"

            find "$GITHUB_WORKSPACE/work" \
              -type f \
              \( \
                -name "*.iso" \
                -o -name "*.img" \
                -o -name "*.qcow2" \
              \) \
              -exec cp -v {} \
              "$GITHUB_WORKSPACE/work/artifacts/" \; \
              || true

            echo
            echo "========================================"
            echo " Final artifacts"
            echo "========================================"

            ls -lah \
              "$GITHUB_WORKSPACE/work/artifacts" \
              || true

      # ============================================================
      # Show output on Ubuntu
      # ============================================================
      - name: Find build output
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo " Build output"
          echo "========================================"

          find . \
            -type f \
            \( \
              -name "*.iso" \
              -o -name "*.img" \
              -o -name "*.qcow2" \
            \) \
            -print \
            | sort

      # ============================================================
      # ISO
      # ============================================================
      - name: Upload FreeBSD ISO
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-amd64-ISO
          path: |
            **/*.iso
          if-no-files-found: warn
          compression-level: 0

      # ============================================================
      # RAW IMG
      # ============================================================
      - name: Upload FreeBSD IMG
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-amd64-IMG
          path: |
            **/*.img
          if-no-files-found: warn
          compression-level: 0

      # ============================================================
      # QCOW2
      # ============================================================
      - name: Upload FreeBSD QCOW2
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-amd64-QCOW2
          path: |
            **/*.qcow2
          if-no-files-found: warn
          compression-level: 0
