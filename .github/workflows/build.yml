name: Build sing-box tuic amd64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.2.7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'

      - name: Remove geo databases
        run: |
          # 删除嵌入的数据库文件
          find . -path "*/geoip*" -name "*.db" -type f -delete 2>/dev/null || true
          find . -path "*/geosite*" -name "*.db" -type f -delete 2>/dev/null || true
          
          # 修改 embed 指令（如果有的话）
          if grep -rl "go:embed" --include="*.go" . > /dev/null 2>&1; then
            grep -rl "go:embed" --include="*.go" . | xargs sed -i 's|//go:embed.*||g'
          fi
          
          echo "Geo databases removed"

      - name: Build TUIC amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -tags "with_quic" \
            -o dist/sing-box-linux-amd64 \
            ./cmd/sing-box
          
          # 显示编译结果
          ls -lh dist/
          file dist/sing-box-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: dist/sing-box-linux-amd64
