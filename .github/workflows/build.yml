name: Build FFmpeg 4.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          yasm \
          nasm \
          pkg-config \
          wget \
          bzip2 \
          mingw-w64 \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64

    - name: Download FFmpeg 4.0 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-4.0.tar.bz2
        tar -xjf ffmpeg-4.0.tar.bz2
        mv ffmpeg-4.0 ffmpeg-src

    - name: Patch FFmpeg 4.0 for Modern GCC
      run: |
        cd ffmpeg-src
        # 🌟 核心修复：精准修改 vfwcap.c 中不符合现代 C 语言规范的指针强制转换，
        # 把 LONG* 转型为 int*，彻底消灭新版 GCC 的编译拦截！
        sed -i 's/av_parse_video_size(&bi->bmiHeader.biWidth,/av_parse_video_size((int *)&bi->bmiHeader.biWidth,/g' libavdevice/vfwcap.c
        sed -i 's/ctx->video_size);/(int *)&bi->bmiHeader.biHeight, ctx->video_size);/g' libavdevice/vfwcap.c
      shell: bash

    - name: Configure FFmpeg
      run: |
        cd ffmpeg-src
        ./configure \
          --prefix=../dist \
          --target-os=mingw32 \
          --arch=x86_64 \
          --cross-prefix=x86_64-w64-mingw32- \
          --pkg-config-flags="--static" \
          --enable-shared \
          --disable-static \
          --enable-gpl \
          --enable-version3 \
          --disable-doc \
          --disable-ffplay \
          --disable-ffprobe
          
        # 避开 windres 编译 Bug
        echo "WINDRES=x86_64-w64-mingw32-windres" >> ffbuild/config.mak
        sed -i 's/WINDRESFLAGS.*/WINDRESFLAGS=/' ffbuild/config.mak
      shell: bash

    - name: Compile and Install
      run: |
        cd ffmpeg-src
        make -j$(nproc)
        make install
      shell: bash

    - name: Prepare Artifacts
      run: |
        mkdir -p ffmpeg-win64
        cp -r dist/bin ffmpeg-win64/
        cp -r dist/include ffmpeg-win64/
        cp -r dist/lib ffmpeg-win64/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-4.0-windows-x64
        path: ffmpeg-win64/
