FROM ubuntu:16.04

RUN apt-get update && apt-get install -y \
    curl \
    unzip \
    p7zip-full \
    && rm -rf /var/lib/apt/lists/*

WORKDIR /build

# 下载 DMD 1.076 Windows 包
RUN curl -L -o dmd.zip "https://downloads.dlang.org/releases/1.x/1.076/dmd.1.076.windows.zip"

# 解压
RUN mkdir dmd && unzip dmd.zip -d dmd

# 删除非 Windows 目录
RUN rm -rf dmd/freebsd dmd/linux dmd/osx dmd/html dmd/man dmd/samples

# 删除 Windows 下多余文件，只保留 bin 和必要文件
RUN rm -rf dmd/windows/lib dmd/windows/src

# 查看最终结构
RUN find dmd -maxdepth 3 -type d
