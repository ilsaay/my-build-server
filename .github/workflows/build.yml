name: Build FFmpeg 4.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          yasm \
          nasm \
          pkg-config \
          wget \
          bzip2 \
          mingw-w64 \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64

    - name: Download FFmpeg 4.0 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-4.0.tar.bz2
        tar -xjf ffmpeg-4.0.tar.bz2
        mv ffmpeg-4.0 ffmpeg-src

    - name: Configure FFmpeg
      run: |
        cd ffmpeg-src
        ./configure \
          --prefix=../dist \
          --target-os=mingw32 \
          --arch=x86_64 \
          --cross-prefix=x86_64-w64-mingw32- \
          --pkg-config-flags="--static" \
          --enable-shared \
          --disable-static \
          --enable-gpl \
          --enable-version3 \
          --disable-doc \
          --disable-ffplay \
          --disable-ffprobe
          
        # 🌟 核心杀手锏：直接修改生成的 config.mak
        # 将 windres 的预处理器指定方式剥离，或直接让 windres 不使用复杂参数，
        # 从而彻底避开新版 binutils 的解析崩溃 Bug。
        echo "WINDRES=x86_64-w64-mingw32-windres" >> ffbuild/config.mak
        sed -i 's/WINDRESFLAGS.*/WINDRESFLAGS=/' ffbuild/config.mak
      shell: bash

    - name: Compile and Install
      run: |
        cd ffmpeg-src
        make -j$(nproc)
        make install
      shell: bash

    - name: Prepare Artifacts
      run: |
        mkdir -p ffmpeg-win64
        cp -r dist/bin ffmpeg-win64/
        cp -r dist/include ffmpeg-win64/
        cp -r dist/lib ffmpeg-win64/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-4.0-windows-x64
        path: ffmpeg-win64/
