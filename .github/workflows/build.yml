name: Build TCC Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
    
    - name: Clone TCC
      shell: msys2 {0}
      run: |
        git clone https://github.com/TinyCC/tinycc.git
        cd tinycc
        git checkout release_0_9_26
        echo "Building TCC 0.9.26 for Windows"
    
    - name: Configure for Windows
      shell: msys2 {0}
      run: |
        cd tinycc
        ./configure \
          --prefix=$GITHUB_WORKSPACE/install \
          --enable-cross
    
    - name: Build Windows TCC
      shell: msys2 {0}
      run: |
        cd tinycc
        make -j2
    
    - name: Install
      shell: msys2 {0}
      run: |
        cd tinycc
        make install
    
    - name: Verify EXE
      shell: msys2 {0}
      run: |
        find $GITHUB_WORKSPACE/install -name "*.exe"
        file $GITHUB_WORKSPACE/install/bin/tcc.exe
    
    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: tcc-windows-exe
        path: |
          ${{ github.workspace }}/install/**/*.exe
          ${{ github.workspace }}/install/**/*.dll
          ${{ github.workspace }}/install/**/*.a
          ${{ github.workspace }}/install/**/include/**
