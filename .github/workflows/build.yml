name: Build SciTE Portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SciTE stable source
        shell: cmd
        run: |
          curl -L -o scite.zip https://www.scintilla.org/scite553.zip
          tar -xf scite.zip

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build SciTE.exe
        shell: cmd
        run: |
          cd scite\win32
          nmake -f scite.mak ..\bin\SciTE.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: SciTE-portable
          path: |
            scite\bin\SciTE.exe
            scite\bin\*.dll
            scite\bin\*.properties
