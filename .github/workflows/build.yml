name: Build TinyCC 0.9.23 (Windows Native 32-bit)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-latest

    steps:
      - name: 设置 MSYS2 MINGW32 编译环境
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: git make mingw-w64-i686-toolchain

      - name: 从 GitHub 下载 TinyCC 0.9.23 源码
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch release_0_9_23 https://github.com/TinyCC/tinycc.git tcc-0.9.23

      - name: 配置并编译 TinyCC 0.9.23 (32位 XP-11)
        shell: msys2 {0}
        run: |
          cd tcc-0.9.23
          # 核心修复：显式指定 --cc=i686-w64-mingw32-gcc 解决找不到 gcc 的问题
          ./configure --cpu=x86 --cc=i686-w64-mingw32-gcc --extra-cflags="-O2 -D_WIN32_WINNT=0x0501 -m32"
          echo "CONFIG_WIN32=yes" >> config.mak
          make

      - name: 打包编译产物
        shell: msys2 {0}
        run: |
          mkdir -p dist/tcc
          cp tcc-0.9.23/tcc.exe dist/tcc/
          cp -r tcc-0.9.23/include dist/tcc/
          cp -r tcc-0.9.23/lib dist/tcc/
          cd dist && zip -r ../tcc-0.9.23-win32.zip tcc

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tcc-0.9.23-win32-xp-11
          path: tcc-0.9.23-win32.zip
