name: Build Rust Control

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.60.1
        shell: powershell
        run: |
          rustup toolchain install 1.60.1 --profile minimal
          rustup run 1.60.1 rustc --version

      - name: Check source
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Files:"
          Get-ChildItem -Recurse -File | Select-Object FullName

          if (!(Test-Path "src\main.rs")) {
            Write-Error "src\main.rs not found!"
            exit 1
          }

      - name: Build
        shell: powershell
        run: |
          rustup run 1.60.1 rustc src\main.rs `
            -C opt-level=3 `
            -C codegen-units=1 `
            -C panic=abort `
            -o rust-control.exe

      - name: Check EXE
        shell: powershell
        run: |
          if (!(Test-Path "rust-control.exe")) {
            Write-Error "rust-control.exe was not generated."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "========================================"

          Get-Item "rust-control.exe" |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rust-control-windows-x64
          path: rust-control.exe
          if-no-files-found: error
