name: Build TinyCC 0.9.23 (32-bit XP-11)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: ubuntu-latest

    steps:
      - name: 安装 MinGW32 交叉编译工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 make zip git

      - name: 从 GitHub 下载 TinyCC 0.9.23 源码
        run: |
          git clone --depth 1 --branch release_0_9_23 https://github.com/TinyCC/tinycc.git tcc-0.9.23

      - name: 编译 TinyCC (Windows XP - 11 32位)
        run: |
          cd tcc-0.9.23
          
          # 1. 将 --cpu=i386 修改为 --cpu=x86
          ./configure --cpu=x86 --cross-prefix=i686-w64-mingw32- --extra-cflags="-O2 -D_WIN32_WINNT=0x0501 -m32 -std=gnu89"
          
          # 2. 强制覆盖 Makefile 的系统识别，防止其执行 Linux 专属的动态库构建指令
          echo "CONFIG_WIN32=yes" >> config.mak
          
          make

      - name: 打包编译产物
        run: |
          mkdir -p dist/tcc
          # MinGW 交叉编译会自动给生成的可执行文件加上 .exe 后缀
          cp tcc-0.9.23/tcc.exe dist/tcc/
          cp -r tcc-0.9.23/include dist/tcc/
          cp -r tcc-0.9.23/lib dist/tcc/
          cd dist && zip -r ../tcc-0.9.23-win32.zip tcc

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tcc-0.9.23-win32-xp-11
          path: tcc-0.9.23-win32.zip
