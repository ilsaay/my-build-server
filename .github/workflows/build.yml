name: Build sing-box TUIC only v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.2.7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Check TUIC source
        run: |
          # 查看 TUIC 相关的源文件
          find . -path "*tuic*" -type f | head -20
          
          # 查看 TUIC 的 build tags
          grep -r "go:build" --include="*.go" . | grep -i tuic
          
          # 查看 TUIC 的 package 声明
          find . -path "*tuic*" -name "*.go" -exec head -5 {} \;

      - name: Build with correct tags
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          
          # 尝试不同的 tags 组合
          go build \
            -trimpath \
            -ldflags "-s -w -buildid=" \
            -tags "with_quic,with_utls" \
            -o dist/sing-box-linux-amd64 \
            ./cmd/sing-box
          
          echo "=== Build complete ==="
          ls -lh dist/
          ./dist/sing-box-linux-amd64 version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: dist/sing-box-linux-amd64
