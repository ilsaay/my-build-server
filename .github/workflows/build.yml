# .github/workflows/build-gcc2723.yml
name: Build GCC 2.7.2.3

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows-msys2
          - windows-cygwin

jobs:
  build-linux:
    if: github.event.inputs.target_os == 'linux'
    runs-on: ubuntu-20.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget texinfo
      
      - name: Download GCC
        run: |
          wget https://ftp.gnu.org/gnu/gcc/gcc-2.7.2.3.tar.gz
          tar -xzf gcc-2.7.2.3.tar.gz
      
      - name: Configure and Build
        run: |
          cd gcc-2.7.2.3
          ./configure --enable-languages=c --prefix=$PWD/install
          make -j2
          make install
      
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: gcc-2723-linux
          path: gcc-2.7.2.3/install

  build-windows:
    if: github.event.inputs.target_os == 'windows-msys2'
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          install: base-devel wget tar
      
      - name: Build in MSYS2
        shell: msys2 {0}
        run: |
          wget https://ftp.gnu.org/gnu/gcc/gcc-2.7.2.3.tar.gz
          tar -xzf gcc-2.7.2.3.tar.gz
          cd gcc-2.7.2.3
          ./configure --enable-languages=c --prefix=$PWD/install
          make -j2
          make install
      
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: gcc-2723-windows
          path: gcc-2.7.2.3/install
