name: Build Rust Control

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.60.1
        shell: powershell
        run: |
          rustup toolchain install 1.60.1 --profile minimal
          rustup default 1.60.1

          Write-Host "========================================"
          rustc --version
          cargo --version
          Write-Host "========================================"

      - name: Build
        shell: powershell
        run: |
          rustc --version
          rustc main.rs -C opt-level=3 -C lto=yes -C codegen-units=1 -C panic=abort -o rust-control.exe

      - name: Check EXE
        shell: powershell
        run: |
          if (!(Test-Path "rust-control.exe")) {
            Write-Error "rust-control.exe was not generated."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "========================================"

          Get-Item "rust-control.exe" |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rust-control-windows-x64
          path: rust-control.exe
          if-no-files-found: error
