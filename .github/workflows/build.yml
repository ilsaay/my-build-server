name: Build GCC Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Verify compilers
        run: |
          gcc --version
          gfortran --version

      - name: Show workspace files
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          echo "=== 当前目录 ==="
          pwd
          echo "=== 文件列表 ==="
          ls -la

      - name: Build C (C89)
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          gcc -std=c89 -pedantic -o hello_c.exe hello.c

      - name: Build Fortran
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          gfortran -o hello_f.exe hello.f90

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            hello_c.exe
            hello_f.exe
          if-no-files-found: warn
