name: Build GStreamer 1.18 for Windows x64 (Containerized)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
    - name: Checkout Cerbero 1.18 branch
      uses: actions/checkout@v4
      with:
        repository: 'GStreamer/cerbero'
        ref: '1.18'

    - name: Install build dependencies
      run: |
        # 容器内默认是 root，无需 sudo
        apt update
        apt install -y \
          python3 \
          python3-pip \
          python3-venv \
          python3-distro \
          git \
          make \
          autoconf \
          automake \
          libtool \
          pkg-config \
          mingw-w64 \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          meson \
          ninja-build \
          cmake \
          yasm \
          nasm \
          gettext \
          libglib2.0-dev \
          libffi-dev \
          zlib1g-dev \
          libbz2-dev \
          liblzma-dev \
          libxml2-dev \
          libcurl4-openssl-dev \
          libssl-dev

    - name: Setup Python virtual environment
      run: |
        python3 -m venv cerbero-venv
        source cerbero-venv/bin/activate
        pip install --upgrade pip
        pip install distro setuptools wheel
        echo "CERBERO_VENV=$(pwd)/cerbero-venv" >> $GITHUB_ENV

    - name: Bootstrap Cerbero
      run: |
        source $CERBERO_VENV/bin/activate
        python ./cerbero-uninstalled bootstrap -v

    - name: Build GStreamer 1.18 for Windows x64
      run: |
        source $CERBERO_VENV/bin/activate
        python ./cerbero-uninstalled -c config/win64.cbc -v cross package gstreamer-1.0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gstreamer-1.18-windows-x64
        path: build/dist/
