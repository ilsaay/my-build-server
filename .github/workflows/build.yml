name: Build GStreamer 1.18 for Windows x64 with MinGW

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Cerbero 1.18 branch
      uses: actions/checkout@v4
      with:
        repository: 'GStreamer/cerbero'
        ref: '1.18'
    
    - name: Setup MSYS2 (MinGW)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: |
          git
          make
          autoconf
          automake
          libtool
          pkg-config
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-nasm
    
    - name: Install Python dependencies
      shell: msys2 {0}
      run: |
        pip install --upgrade pip
        pip install setuptools wheel
    
    - name: Bootstrap Cerbero
      shell: msys2 {0}
      run: |
        ./cerbero-uninstalled bootstrap -v
    
    - name: Build GStreamer 1.18 with MinGW
      shell: msys2 {0}
      run: |
        # 使用 MinGW 64位变体
        ./cerbero-uninstalled -c config/win64.cbc -v mingw package gstreamer-1.0
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gstreamer-1.18-mingw-w64
        path: build/dist/
