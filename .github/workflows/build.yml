name: Build FreeBSD Java17 Server

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FREEBSD_VERSION: "14.3"
  FREEBSD_ARCH: "amd64"

jobs:
  build:
    name: Build FreeBSD Java17 EFI Server
    runs-on: ubuntu-24.04

    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. Install build tools
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xorriso \
            libarchive-tools \
            wget \
            curl \
            openssh-client \
            sshpass

      # ============================================================
      # 2. Download FreeBSD 14.3 amd64
      # ============================================================

      - name: Download FreeBSD
        shell: bash
        run: |
          set -eux

          mkdir -p work
          cd work

          URL="https://download.freebsd.org/releases/amd64/amd64/ISO-IMAGES/${FREEBSD_VERSION}/FreeBSD-${FREEBSD_VERSION}-RELEASE-${FREEBSD_ARCH}-disc1.iso"

          echo "Downloading:"
          echo "$URL"

          wget \
            --progress=dot:giga \
            "$URL" \
            -O freebsd.iso

          test -s freebsd.iso

          ls -lh freebsd.iso

      # ============================================================
      # 3. Create automatic installer configuration
      #
      # FreeBSD bsdinstall supports /etc/installerconfig.
      #
      # GPT + UFS
      # EFI boot partition is created automatically.
      # ============================================================

      - name: Create installerconfig
        shell: bash
        run: |
          set -eux

          cd work

          cat > installerconfig <<'EOF'
          #!/bin/sh

          # --------------------------------------------------------
          # FreeBSD automatic installation
          # --------------------------------------------------------

          # GPT partitioning.
          #
          # The FreeBSD installer automatically creates the EFI
          # system partition when using GPT on amd64.
          #
          PARTITIONS="DEFAULT"

          # Install the normal FreeBSD base system.
          DISTRIBUTIONS="base.txz kernel.txz"

          # --------------------------------------------------------
          # Setup script
          # --------------------------------------------------------

          # Set root password.
          echo 'root-build-password' | pw usermod root -h 0

          # Hostname.
          sysrc hostname="java-server"

          # DHCP.
          sysrc ifconfig_DEFAULT="DHCP"

          # SSH.
          sysrc sshd_enable="YES"

          # Enable SSH root login temporarily.
          #
          # This is only used during the GitHub Actions build.
          # The build workflow disables it later.
          if [ -f /etc/ssh/sshd_config ]; then

              sed -i '' \
                  's/^#PermitRootLogin no/PermitRootLogin yes/' \
                  /etc/ssh/sshd_config

              sed -i '' \
                  's/^PermitRootLogin no/PermitRootLogin yes/' \
                  /etc/ssh/sshd_config

              sed -i '' \
                  's/^#PasswordAuthentication yes/PasswordAuthentication yes/' \
                  /etc/ssh/sshd_config

              sed -i '' \
                  's/^PasswordAuthentication no/PasswordAuthentication yes/' \
                  /etc/ssh/sshd_config

          fi

          # --------------------------------------------------------
          # Create first-boot provisioning service.
          #
          # OpenJDK cannot be installed safely during the
          # bsdinstall chroot phase because networking has not
          # necessarily been started yet.
          #
          # Therefore it is installed on the first real boot.
          # --------------------------------------------------------

          cat > /etc/rc.d/java-firstboot <<'RCEOF'
          #!/bin/sh

          # PROVIDE: java_firstboot
          # REQUIRE: NETWORKING
          # BEFORE: LOGIN
          # KEYWORD: firstboot

          . /etc/rc.subr

          name="java_firstboot"
          rcvar="java_firstboot_enable"

          start_cmd="java_firstboot_start"

          load_rc_config "$name"

          : ${java_firstboot_enable:="YES"}

          java_firstboot_start()
          {
              (
                  sleep 10

                  export ASSUME_ALWAYS_YES=yes

                  echo "======================================"
                  echo " FreeBSD Java17 first boot"
                  echo "======================================"

                  echo "[1/7] Bootstrap pkg"

                  if ! command -v pkg >/dev/null 2>&1; then
                      env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
                  fi

                  echo "[2/7] Updating pkg"

                  pkg update -f

                  echo "[3/7] Installing OpenJDK 17"

                  pkg install -y java/openjdk17

                  echo "[4/7] Creating java user"

                  if ! pw usershow java >/dev/null 2>&1; then
                      pw useradd java \
                          -d /srv \
                          -s /usr/sbin/nologin \
                          -m
                  fi

                  echo "[5/7] Creating server directories"

                  mkdir -p \
                      /srv/server \
                      /srv/server/logs

                  chown -R java:java /srv

                  chmod 750 /srv/server

                  echo "[6/7] Creating Java server launcher"

                  cat > /usr/local/bin/java-server <<'JAVAEOS'
          #!/bin/sh

          set -eu

          JAVA="/usr/local/bin/java"

          SERVER="/srv/server/server.jar"

          if [ ! -f "$SERVER" ]; then

              echo
              echo "=============================================="
              echo " Java Server"
              echo "=============================================="
              echo
              echo "server.jar not found."
              echo
              echo "Put your JAR here:"
              echo
              echo "    /srv/server/server.jar"
              echo
              exit 1

          fi

          cd /srv/server

          exec "$JAVA" \
              -Xms1G \
              -Xmx4G \
              -XX:+UseG1GC \
              -jar "$SERVER" \
              nogui
          JAVAEOS

                  chmod 755 /usr/local/bin/java-server

                  echo "[7/7] Creating Java server service"

                  cat > /usr/local/etc/rc.d/java-server <<'RCEOF2'
          #!/bin/sh

          # PROVIDE: java_server
          # REQUIRE: NETWORKING
          # KEYWORD: shutdown

          . /etc/rc.subr

          name="java_server"
          rcvar="java_server_enable"

          command="/usr/local/bin/java-server"

          load_rc_config "$name"

          : ${java_server_enable:="YES"}

          pidfile="/var/run/java-server.pid"

          start_cmd="${name}_start"

          java_server_start()
          {
              if [ ! -f /srv/server/server.jar ]; then
                  echo "java-server: /srv/server/server.jar not found"
                  return 0
              fi

              su -m java -c "/usr/local/bin/java-server > /srv/server/logs/server.log 2>&1 &"
          }

          run_rc_command "$1"
          RCEOF2

                  chmod 755 /usr/local/etc/rc.d/java-server

                  sysrc java_server_enable="YES"

                  echo
                  echo "FreeBSD Java17 installation finished."
                  echo

                  # ------------------------------------------------
                  # Disable temporary root SSH access.
                  # ------------------------------------------------

                  if [ -f /etc/ssh/sshd_config ]; then

                      sed -i '' \
                          's/^PermitRootLogin yes/PermitRootLogin no/' \
                          /etc/ssh/sshd_config

                      sed -i '' \
                          's/^PasswordAuthentication yes/PasswordAuthentication no/' \
                          /etc/ssh/sshd_config

                  fi

                  # Disable firstboot.
                  sysrc java_firstboot_enable="NO"

                  rm -f /etc/rc.d/java-firstboot

                  echo
                  echo "First boot provisioning complete."

              ) >> /var/log/java-firstboot.log 2>&1 &
          }

          run_rc_command "$1"
          RCEOF

          chmod 755 /etc/rc.d/java-firstboot

          sysrc java_firstboot_enable="YES"

          # --------------------------------------------------------
          # Build information
          # --------------------------------------------------------

          cat > /etc/freebsd-java17-release <<'INFOEOF'
          FreeBSD Java17 Server

          FreeBSD:
          14.3-RELEASE

          Architecture:
          amd64

          Boot:
          EFI / UEFI

          Filesystem:
          UFS

          Java:
          OpenJDK 17

          Java server directory:
          /srv/server

          Java server executable:
          /usr/local/bin/java-server

          INFOEOF

          echo
          echo "installerconfig created."

      # ============================================================
      # 4. Inject /etc/installerconfig into the official ISO
      # ============================================================

      - name: Create automatic FreeBSD ISO
        shell: bash
        run: |
          set -eux

          cd work

          rm -f freebsd-auto.iso

          xorriso \
            -indev freebsd.iso \
            -outdev freebsd-auto.iso \
            -map installerconfig /etc/installerconfig \
            -boot_image any replay \
            -commit \
            -end

          test -s freebsd-auto.iso

          ls -lh \
            freebsd.iso \
            freebsd-auto.iso

      # ============================================================
      # 5. Create empty target disk
      # ============================================================

      - name: Create target disk
        shell: bash
        run: |
          set -eux

          cd work

          qemu-img create \
            -f raw \
            freebsd-java17-amd64.img \
            8G

          ls -lh freebsd-java17-amd64.img

      # ============================================================
      # 6. Prepare UEFI firmware
      # ============================================================

      - name: Prepare EFI firmware
        shell: bash
        run: |
          set -eux

          cd work

          mkdir -p uefi

          cp \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            uefi/OVMF_CODE.fd

          cp \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            uefi/OVMF_VARS.fd

      # ============================================================
      # 7. Install FreeBSD automatically
      #
      # QEMU:
      #
      #   EFI
      #    |
      #    +-- FreeBSD installer ISO
      #    |
      #    +-- target disk
      #
      # The /etc/installerconfig file starts the unattended
      # installation.
      # ============================================================

      - name: Install FreeBSD
        shell: bash
        run: |
          set -eux

          cd work

          timeout 20m \
          qemu-system-x86_64 \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file=uefi/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=uefi/OVMF_VARS.fd \
            -drive file=freebsd-java17-amd64.img,format=raw,if=virtio \
            -cdrom freebsd-auto.iso \
            -boot d \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -serial file:install.log \
            -display none \
            -no-reboot || true

          echo
          echo "======================================"
          echo " FreeBSD installer output"
          echo "======================================"

          cat install.log || true

          test -s freebsd-java17-amd64.img

      # ============================================================
      # 8. Boot installed FreeBSD and wait for SSH
      # ============================================================

      - name: Boot installed FreeBSD
        shell: bash
        run: |
          set -eux

          cd work

          cp \
            uefi/OVMF_VARS.fd \
            uefi/OVMF_VARS_RUNTIME.fd

          qemu-system-x86_64 \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 4096 \
            -drive if=pflash,format=raw,readonly=on,file=uefi/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=uefi/OVMF_VARS_RUNTIME.fd \
            -drive file=freebsd-java17-amd64.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -serial file:boot.log \
            -display none \
            -daemonize

          echo "Waiting for FreeBSD SSH..."

          for i in $(seq 1 120); do

              if nc -z 127.0.0.1 2222 2>/dev/null; then
                  echo "SSH port is open."
                  break
              fi

              sleep 2

          done

          if ! nc -z 127.0.0.1 2222 2>/dev/null; then
              echo "SSH did not start."
              cat boot.log || true
              exit 1
          fi

      # ============================================================
      # 9. Wait for OpenJDK 17 first boot installation
      # ============================================================

      - name: Wait for OpenJDK 17
        shell: bash
        run: |
          set -eux

          echo "Waiting for FreeBSD firstboot..."

          for i in $(seq 1 120); do

              if sshpass -p 'root-build-password' \
                  ssh \
                  -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=5 \
                  root@127.0.0.1 \
                  'test -x /usr/local/bin/java && /usr/local/bin/java -version' \
                  2>&1; then

                  echo
                  echo "OpenJDK 17 is installed."
                  break

              fi

              sleep 5

          done

          sshpass -p 'root-build-password' \
            ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 \
            '/usr/local/bin/java -version'

      # ============================================================
      # 10. Verify system
      # ============================================================

      - name: Verify FreeBSD Java17 system
        shell: bash
        run: |
          set -eux

          sshpass -p 'root-build-password' \
            ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 \
            '
              echo "===== FreeBSD ====="
              uname -a

              echo
              echo "===== Java ====="
              /usr/local/bin/java -version

              echo
              echo "===== Java launcher ====="
              ls -l /usr/local/bin/java-server

              echo
              echo "===== Server directory ====="
              ls -ld /srv/server

              echo
              echo "===== EFI ====="
              gpart show

              echo
              echo "===== rc.conf ====="
              grep -E "sshd_enable|java_server_enable|ifconfig_DEFAULT" /etc/rc.conf
            '

      # ============================================================
      # 11. Shutdown VM cleanly
      # ============================================================

      - name: Shutdown FreeBSD
        shell: bash
        run: |
          set -eux

          sshpass -p 'root-build-password' \
            ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@127.0.0.1 \
            'shutdown -p now' || true

          sleep 10

      # ============================================================
      # 12. Compress final image
      # ============================================================

      - name: Compress image
        shell: bash
        run: |
          set -eux

          cd work

          xz -T0 -9 \
            -c freebsd-java17-amd64.img \
            > freebsd-java17-amd64.img.xz

          ls -lh \
            freebsd-java17-amd64.img \
            freebsd-java17-amd64.img.xz

      # ============================================================
      # 13. Upload final image
      # ============================================================

      - name: Upload FreeBSD Java17 image
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-Java17-amd64
          compression-level: 0
          path: |
            work/freebsd-java17-amd64.img
            work/freebsd-java17-amd64.img.xz
            work/freebsd-auto.iso
            work/install.log
            work/boot.log
