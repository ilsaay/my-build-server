name: Build FreeBSD Java17 Server

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FREEBSD_VERSION: "14.3"
  TARGET: "amd64"
  TARGET_ARCH: "amd64"

jobs:
  build:
    name: FreeBSD 14.3 Java17 amd64
    runs-on: ubuntu-24.04

    timeout-minutes: 180

    steps:

      # ==========================================================
      # 1. Install build dependencies
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            subversion \
            ca-certificates \
            curl \
            wget \
            xz-utils \
            bzip2 \
            gzip \
            tar \
            unzip \
            rsync \
            qemu-utils \
            qemu-system-x86 \
            ovmf \
            xorriso \
            pkg-config \
            libarchive-tools

      # ==========================================================
      # 2. Prepare workspace
      # ==========================================================

      - name: Prepare workspace
        shell: bash
        run: |
          set -eux

          mkdir -p \
            "$GITHUB_WORKSPACE/work" \
            "$GITHUB_WORKSPACE/output"

          df -h

      # ==========================================================
      # 3. Download FreeBSD 14.3 source
      #
      # We use the official FreeBSD src tree.
      # ==========================================================

      - name: Download FreeBSD source
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/work"

          git clone \
            --depth 1 \
            --branch releng/14.3 \
            https://git.FreeBSD.org/src.git \
            src

          cd src

          git rev-parse HEAD

      # ==========================================================
      # 4. Create FreeBSD release.conf
      # ==========================================================

      - name: Create release configuration
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/work"

          cat > release.conf <<'EOF'
          # ======================================================
          # FreeBSD 14.3 Java17 Server
          # ======================================================

          TARGET="amd64"
          TARGET_ARCH="amd64"

          KERNEL="GENERIC"

          # ------------------------------------------------------
          # Release directory
          # ------------------------------------------------------

          CHROOTDIR="/scratch"

          # ------------------------------------------------------
          # Source tree
          # ------------------------------------------------------

          SRCBRANCH="releng/14.3"

          # ------------------------------------------------------
          # Build options
          # ------------------------------------------------------

          WITHOUT_DEBUG_FILES="yes"

          WITHOUT_KERNEL_SYMBOLS="yes"

          WITHOUT_MAN="no"

          WITHOUT_PROFILE="yes"

          # ------------------------------------------------------
          # Packages
          #
          # OpenJDK 17 will be installed into the release.
          # ------------------------------------------------------

          EXTRA_PACKAGES="
          openjdk17
          "

          # ------------------------------------------------------
          # EFI boot
          # ------------------------------------------------------

          WITH_EFI="yes"

          # Do not build/install legacy BIOS boot code.
          WITHOUT_BIOS="yes"

          # ------------------------------------------------------
          # Filesystem
          # ------------------------------------------------------

          WITH_ZFS="no"

          # ------------------------------------------------------
          # Compression
          # ------------------------------------------------------

          XZ_THREADS="0"

          XZ_COMPRESS_FLAGS="-9"

          EOF

          cat release.conf

      # ==========================================================
      # 5. Create custom files
      # ==========================================================

      - name: Create custom FreeBSD files
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/work"

          mkdir -p custom/etc
          mkdir -p custom/etc/rc.d
          mkdir -p custom/usr/local/bin
          mkdir -p custom/srv/server

          # ------------------------------------------------------
          # rc.conf
          # ------------------------------------------------------

          cat > custom/etc/rc.conf <<'EOF'
          hostname="java-server"

          sshd_enable="YES"

          java_server_enable="YES"

          dumpdev="NO"

          sendmail_enable="NONE"

          moused_nondefault_enable="NO"
          EOF

          # ------------------------------------------------------
          # Java server launcher
          # ------------------------------------------------------

          cat > custom/usr/local/bin/java-server <<'EOF'
          #!/bin/sh

          set -eu

          JAVA="/usr/local/bin/java"

          SERVER="/srv/server/server.jar"

          if [ ! -x "$JAVA" ]; then
              echo "OpenJDK 17 was not found."
              exit 1
          fi

          if [ ! -f "$SERVER" ]; then
              echo
              echo "=========================================="
              echo " FreeBSD Java Server"
              echo "=========================================="
              echo
              echo "server.jar not found."
              echo
              echo "Place your Java application here:"
              echo
              echo "  /srv/server/server.jar"
              echo
              exit 1
          fi

          cd /srv/server

          exec "$JAVA" \
              -Xms1G \
              -Xmx4G \
              -XX:+UseG1GC \
              -jar "$SERVER" \
              nogui
          EOF

          chmod 755 custom/usr/local/bin/java-server

          # ------------------------------------------------------
          # Java server rc.d service
          # ------------------------------------------------------

          cat > custom/etc/rc.d/java-server <<'EOF'
          #!/bin/sh

          # PROVIDE: java_server
          # REQUIRE: NETWORKING
          # KEYWORD: shutdown

          . /etc/rc.subr

          name="java_server"
          rcvar="java_server_enable"

          command="/usr/local/bin/java-server"

          start_cmd="java_server_start"

          stop_cmd="java_server_stop"

          java_server_start()
          {
              if [ ! -f /srv/server/server.jar ]; then
                  echo "java-server: server.jar not found."
                  return 0
              fi

              if [ ! -d /srv/server/logs ]; then
                  mkdir -p /srv/server/logs
              fi

              cd /srv/server

              /usr/sbin/daemon \
                  -p /var/run/java-server.pid \
                  -o /srv/server/logs/server.log \
                  /usr/local/bin/java-server
          }

          java_server_stop()
          {
              if [ -f /var/run/java-server.pid ]; then
                  kill "$(cat /var/run/java-server.pid)" 2>/dev/null || true
                  rm -f /var/run/java-server.pid
              fi
          }

          load_rc_config "$name"

          : ${java_server_enable:="YES"}

          run_rc_command "$1"
          EOF

          chmod 755 custom/etc/rc.d/java-server

          # ------------------------------------------------------
          # System information
          # ------------------------------------------------------

          cat > custom/etc/freebsd-java17-release <<'EOF'
          FreeBSD Java17 Server

          FreeBSD:
          14.3-RELEASE

          Architecture:
          amd64

          Boot:
          EFI / UEFI

          Java:
          OpenJDK 17

          Server:
          /srv/server/server.jar

          Launcher:
          /usr/local/bin/java-server

          Service:
          java_server

          EOF

          # ------------------------------------------------------
          # Server directory
          # ------------------------------------------------------

          mkdir -p custom/srv/server/logs

          echo "Custom files created."

          find custom -type f -print

      # ==========================================================
      # 6. Create customization script
      # ==========================================================

      - name: Create customization script
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/work"

          cat > customize.sh <<'EOF'
          #!/bin/sh

          set -eux

          ROOT="$1"

          echo "Customizing FreeBSD release:"
          echo "$ROOT"

          # ------------------------------------------------------
          # Copy custom configuration
          # ------------------------------------------------------

          cp -a custom/etc/rc.conf \
              "$ROOT/etc/rc.conf"

          mkdir -p "$ROOT/etc/rc.d"

          cp -a custom/etc/rc.d/java-server \
              "$ROOT/etc/rc.d/java-server"

          mkdir -p "$ROOT/usr/local/bin"

          cp -a custom/usr/local/bin/java-server \
              "$ROOT/usr/local/bin/java-server"

          mkdir -p "$ROOT/srv/server/logs"

          cp -a custom/etc/freebsd-java17-release \
              "$ROOT/etc/freebsd-java17-release"

          # ------------------------------------------------------
          # Create java user
          # ------------------------------------------------------

          if ! chroot "$ROOT" pw usershow java >/dev/null 2>&1; then
              chroot "$ROOT" pw useradd java \
                  -d /srv \
                  -s /usr/sbin/nologin
          fi

          chroot "$ROOT" chown -R java:java /srv

          # ------------------------------------------------------
          # Permissions
          # ------------------------------------------------------

          chmod 755 \
              "$ROOT/usr/local/bin/java-server"

          chmod 755 \
              "$ROOT/etc/rc.d/java-server"

          chmod 750 \
              "$ROOT/srv/server"

          # ------------------------------------------------------
          # Disable services that are not needed
          # ------------------------------------------------------

          cat >> "$ROOT/etc/rc.conf" <<'RCEOF'

          # Java Server OS
          clear_tmp_enable="YES"

          RCEOF

          echo "Customization finished."

          EOF

          chmod 755 customize.sh

      # ==========================================================
      # 7. Build FreeBSD release
      #
      # FreeBSD release.sh is the official release builder.
      # ==========================================================

      - name: Build FreeBSD release
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/work/src"

          export MAKE_JOBS=$(( $(nproc) ))

          echo "CPU:"
          nproc

          echo
          echo "Building FreeBSD 14.3..."
          echo

          env \
            MAKE_JOBS="$MAKE_JOBS" \
            /bin/sh release/release.sh \
              -c "$GITHUB_WORKSPACE/work/release.conf"

      # ==========================================================
      # 8. Find generated release files
      # ==========================================================

      - name: Find release files
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/work"

          echo "Generated files:"
          echo

          find . \
            -type f \
            \( \
              -name "*.iso" \
              -o -name "*.img" \
              -o -name "*.txz" \
            \) \
            -print

      # ==========================================================
      # 9. Collect ISO / IMG
      # ==========================================================

      - name: Collect build output
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/output"

          find "$GITHUB_WORKSPACE/work" \
            -type f \
            \( \
              -name "*.iso" \
              -o -name "*.img" \
            \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          echo
          echo "Output:"
          ls -lah "$GITHUB_WORKSPACE/output"

      # ==========================================================
      # 10. Verify output
      # ==========================================================

      - name: Verify output
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/output"

          if ! find . -type f -name "*.iso" | grep -q .; then
              echo "ERROR: No ISO generated."
              exit 1
          fi

          echo
          echo "ISO files:"
          find . -type f -name "*.iso" -exec ls -lh {} \;

          echo
          echo "IMG files:"
          find . -type f -name "*.img" -exec ls -lh {} \;

      # ==========================================================
      # 11. SHA256
      # ==========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/output"

          sha256sum * \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # ==========================================================
      # 12. Upload final artifacts
      # ==========================================================

      - name: Upload FreeBSD Java17 build
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-Java17-amd64
          compression-level: 0
          path: |
            output/*
