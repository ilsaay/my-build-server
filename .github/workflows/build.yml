name: Build Windows x64

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 EXE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Show compiler
        run: |
          x86_64-w64-mingw32-gcc --version

      - name: Prepare output directory
        run: |
          rm -rf bin
          mkdir -p bin

      - name: Compile strict C89
        run: |
          x86_64-w64-mingw32-gcc \
            -std=c89 \
            -pedantic-errors \
            -Wall \
            -Wextra \
            -Wconversion \
            -Wshadow \
            -Wstrict-prototypes \
            -Wmissing-prototypes \
            -O2 \
            -mconsole \
            -o bin/sysinfo.exe \
            src/main.c

      - name: Verify executable
        run: |
          file bin/sysinfo.exe
          ls -lh bin/sysinfo.exe
          x86_64-w64-mingw32-objdump -p bin/sysinfo.exe | grep "DLL Name"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-windows-x64
          path: bin/sysinfo.exe
          if-no-files-found: error
          retention-days: 30
