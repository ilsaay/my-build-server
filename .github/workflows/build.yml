# .github/workflows/build-tcc.yml
name: Build TCC 0.9.23

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget
    
    - name: Download TCC 0.9.23
      run: |
        wget https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.23.tar.gz
        tar -xzf tcc-0.9.23.tar.gz
        cd tcc-0.9.23
        ls -la
    
    - name: Configure TCC
      run: |
        cd tcc-0.9.23
        ./configure \
          --prefix=$GITHUB_WORKSPACE/tcc-install \
          --disable-static
    
    - name: Build TCC
      run: |
        cd tcc-0.9.23
        make -j2
    
    - name: Install TCC
      run: |
        cd tcc-0.9.23
        make install
    
    - name: Test TCC
      run: |
        $GITHUB_WORKSPACE/tcc-install/bin/tcc --version
        echo '#include <stdio.h>
        int main() { printf("TCC 0.9.23 works!\n"); return 0; }' > test.c
        $GITHUB_WORKSPACE/tcc-install/bin/tcc test.c -o test
        ./test
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tcc-0923
        path: $GITHUB_WORKSPACE/tcc-install
