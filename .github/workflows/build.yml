name: Build TCC Windows with Patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          base-devel
          git
          mingw-w64-x86_64-gcc
    
    - name: Clone TCC
      shell: msys2 {0}
      run: |
        git clone https://github.com/TinyCC/tinycc.git
        cd tinycc
        git checkout release_0_9_26
    
    - name: Apply compatibility patches
      shell: msys2 {0}
      run: |
        cd tinycc
        
        # 修复 spawnvp 参数类型
        sed -i 's/(char const\*const\*)argv/(char *const*)argv/' tcc.c
        
        # 如果有其他指针类型问题
        sed -i 's/const char \*const\*/char *const*/g' tcc.c libtcc.c
        
        # 显示修改
        git diff
    
    - name: Configure
      shell: msys2 {0}
      run: |
        cd tinycc
        ./configure --prefix=$GITHUB_WORKSPACE/install
    
    - name: Build
      shell: msys2 {0}
      run: |
        cd tinycc
        make -j2 CFLAGS="-O2 -w"
    
    - name: Install
      shell: msys2 {0}
      run: |
        cd tinycc
        make install
    
    - name: Check output
      shell: msys2 {0}
      run: |
        ls -la $GITHUB_WORKSPACE/install/
        find $GITHUB_WORKSPACE/install -name "*.exe"
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: tcc-windows
        path: $GITHUB_WORKSPACE/install
