name: Build TCC 0.9.26

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # 使用较老版本
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git
    
    - name: Clone TCC
      run: |
        git clone https://github.com/TinyCC/tinycc.git
        cd tinycc
        git checkout release_0_9_26
    
    - name: Configure
      run: |
        cd tinycc
        ./configure --prefix=$GITHUB_WORKSPACE/install
    
    - name: Build
      run: |
        cd tinycc
        make -j2
    
    - name: Install
      run: |
        cd tinycc
        make install
    
    - name: Verify TCC binary
      run: |
        ls -la $GITHUB_WORKSPACE/install/bin/
        file $GITHUB_WORKSPACE/install/bin/tcc
        # 测试 TCC 是否能运行
        $GITHUB_WORKSPACE/install/bin/tcc -v 2>&1 || true
    
    - name: Test simple compilation (no execution)
      run: |
        # 只编译，不运行
        echo 'int main(void) { return 0; }' > test.c
        $GITHUB_WORKSPACE/install/bin/tcc -c test.c -o test.o
        echo "Compilation successful!"
        ls -la test.o
    
    - name: Test static compilation
      run: |
        # 尝试静态编译
        echo 'int main(void) { return 0; }' > test2.c
        $GITHUB_WORKSPACE/install/bin/tcc -static test2.c -o test2_static
        echo "Static compilation successful!"
        file test2_static
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tcc-0926
        path: $GITHUB_WORKSPACE/install
