name: Build GCC 2.7.2.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget texinfo bison flex
    
    - name: Download GCC
      run: |
        wget https://ftp.gnu.org/gnu/gcc/gcc-2.7.2.3.tar.gz
        tar -xzf gcc-2.7.2.3.tar.gz
    
    - name: Configure
      run: |
        cd gcc-2.7.2.3
        ./configure \
          --host=$(gcc -dumpmachine) \
          --build=$(gcc -dumpmachine) \
          --enable-languages=c \
          --disable-shared \
          --disable-threads \
          --disable-nls \
          --prefix=$GITHUB_WORKSPACE/install
    
    - name: Build (with warnings suppressed)
      run: |
        cd gcc-2.7.2.3
        make -j2 CFLAGS="-w -O0"  # -w 忽略警告
    
    - name: Install
      run: |
        cd gcc-2.7.2.3
        make install
    
    - name: Test
      run: |
        $GITHUB_WORKSPACE/install/bin/gcc --version
        echo '#include <stdio.h>
        int main() { printf("GCC 2.7.2.3 works!\n"); return 0; }' > test.c
        $GITHUB_WORKSPACE/install/bin/gcc test.c -o test
        ./test
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: gcc-2723
        path: $GITHUB_WORKSPACE/install
