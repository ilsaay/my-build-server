name: Build Geany 1.24 Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-i686 \
            binutils-mingw-w64-i686 \
            make \
            wget \
            unzip \
            xz-utils \
            bzip2 \
            pkg-config \
            gettext \
            intltool \
            libtool \
            autoconf \
            automake \
            libglib2.0-dev

      - name: Download GTK2 Windows bundle (32-bit)
        run: |
          wget https://download.gnome.org/binaries/win32/gtk+/2.24/gtk+-bundle_2.24.10-20120208_win32.zip
          unzip -q gtk+-bundle_2.24.10-20120208_win32.zip -d /opt/gtk2-win32
          echo "PKG_CONFIG_PATH=/opt/gtk2-win32/lib/pkgconfig" >> $GITHUB_ENV

      - name: Download Geany 1.24 source
        run: |
          wget https://download.geany.org/geany-1.24.1.tar.bz2 && tar xjf geany-1.24.1.tar.bz2 && mv geany-1.24.1 geany-1.24 && exit 0
          wget https://download.geany.org/geany-1.24.0.tar.bz2 && tar xjf geany-1.24.0.tar.bz2 && mv geany-1.24.0 geany-1.24 && exit 0
          wget https://github.com/geany/geany/archive/refs/tags/1.24.0.tar.gz && tar xzf 1.24.0.tar.gz && mv geany-1.24.0 geany-1.24 && exit 0
          echo "All download attempts failed"
          exit 1

      - name: Generate configure if missing
        run: |
          cd geany-1.24
          if [ ! -f configure ]; then
            echo "configure not found, running autogen.sh"
            NOCONFIGURE=1 ./autogen.sh
          fi

      - name: Configure Geany (dynamic, portable)
        run: |
          cd geany-1.24
          ./configure \
            --host=i686-w64-mingw32 \
            --target=i686-w64-mingw32 \
            --build=x86_64-linux-gnu \
            --disable-static \
            --enable-shared \
            --disable-html-docs \
            --disable-pdf-docs \
            --disable-api-docs \
            --disable-socket \
            --disable-vte \
            CFLAGS="-O2 -I/opt/gtk2-win32/include -I/opt/gtk2-win32/include/gtk-2.0 -I/opt/gtk2-win32/include/glib-2.0 -I/opt/gtk2-win32/lib/glib-2.0/include" \
            LDFLAGS="-L/opt/gtk2-win32/lib"

      - name: Build Geany
        run: |
          cd geany-1.24
          make -j$(nproc)

      - name: Create portable directory
        run: |
          mkdir -p portable/{bin,lib,share,etc}
          
          cp geany-1.24/src/geany.exe portable/bin/ || true
          cp -r geany-1.24/data portable/share/geany || true
          mkdir -p portable/share/geany/plugins
          
          cp /opt/gtk2-win32/bin/*.dll portable/bin/ || true
          cp -r /opt/gtk2-win32/etc portable/ || true
          cp -r /opt/gtk2-win32/lib portable/ || true
          cp -r /opt/gtk2-win32/share portable/ || true
          
          cat > portable/启动Geany.bat << 'EOF'
          @echo off
          cd /d "%~dp0"
          set PATH=%~dp0bin;%~dp0lib;%PATH%
          set GTK2_RC_FILES=%~dp0etc\gtk-2.0\gtkrc
          set GTK_EXE_PREFIX=%~dp0
          set GTK_DATA_PREFIX=%~dp0
          start "" "%~dp0bin\geany.exe" %*
          EOF
          
          find portable -type f | head -50
          du -sh portable

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: geany-1.24-windows-portable
          path: portable/
