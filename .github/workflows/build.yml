name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # 关键修复：使用 MSYS2 官方源中正确的包名
          install: >-
            mingw-w64-ucrt-x86_64-gcc-ada
            mingw-w64-ucrt-x86_64-gprbuild

      - name: Show Ada version
        shell: msys2 {0}
        run: |
          gnat --version
          gprbuild --version

      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p bin
          gnatmake -P src/main.adb -D bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-windows
          # 产物是 main.exe
          path: bin/main.exe
          if-no-files-found: error
