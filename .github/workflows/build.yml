name: Free Ubuntu Build Server

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: System Info
      run: |
        uname -a
        lscpu
        free -h

    - name: Docker Test
      run: |
        docker run --rm ubuntu:22.04 bash -c "
        apt update &&
        apt install -y gcc &&
        echo '#include <stdio.h>
        int main(){printf(\"Hello GitHub\");}' > test.c &&
        gcc test.c -o test &&
        ./test
        "
