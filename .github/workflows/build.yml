name: Build FreeBSD 14.3 Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-freebsd:
    name: Build FreeBSD 14.3 amd64 Server
    runs-on: ubuntu-22.04

    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Run the actual FreeBSD build inside a real FreeBSD VM.
      #
      # IMPORTANT:
      # release.sh is NOT executed by Ubuntu.
      # It is executed inside FreeBSD 14.3.
      # ------------------------------------------------------------
      - name: Build inside FreeBSD 14.3
        id: freebsd
        uses: vmactions/freebsd-vm@v1.2.4
        with:
          release: "14.3"
          arch: "amd64"
          mem: 8192
          cpu: 4
          usesh: true
          copyback: true

          prepare: |
            set -eux

            echo "========================================"
            echo " FreeBSD build environment"
            echo "========================================"

            freebsd-version
            uname -a
            sysctl -n hw.ncpu
            df -h

            echo
            echo "Installing build dependencies..."

            pkg update -f

            pkg install -y \
              git \
              ca_root_nss \
              curl \
              wget \
              rsync \
              xz \
              sudo \
              bash \
              gmake

          run: |
            set -eux

            echo "========================================"
            echo " FreeBSD 14.3 release build"
            echo "========================================"

            freebsd-version
            uname -m
            sysctl -n hw.ncpu

            export MAKE_JOBS=4

            echo
            echo "CPU:"
            sysctl -n hw.ncpu

            echo
            echo "Disk:"
            df -h

            mkdir -p "$GITHUB_WORKSPACE/work"
            cd "$GITHUB_WORKSPACE/work"

            rm -rf src

            echo
            echo "========================================"
            echo " Download FreeBSD 14.3 source"
            echo "========================================"

            git clone \
              --depth 1 \
              --branch releng/14.3 \
              https://git.freebsd.org/src.git \
              src

            cd src

            echo
            echo "FreeBSD source:"
            git describe --always --dirty || true

            echo
            echo "========================================"
            echo " Create release.conf"
            echo "========================================"

            cat > "$GITHUB_WORKSPACE/work/release.conf" <<'EOF'
            #!/bin/sh

            # --------------------------------------------------------
            # FreeBSD release configuration
            # --------------------------------------------------------

            CHROOTDIR="/scratch"

            TARGET="amd64"
            TARGET_ARCH="amd64"

            KERNEL="GENERIC"

            # We already cloned the source tree.
            # Prevent release.sh from downloading another source tree.
            NOGIT=1

            # Do not build the ports tree into the release.
            NOPORTS=1

            # Do not include FreeBSD source in the release media.
            NOSRC=1

            # Do not generate release documentation.
            NODOC=1

            # Build installation media.
            WITH_DVD=""

            # Build VM images.
            WITH_VMIMAGES=1

            # VM formats.
            VMFORMATS="raw qcow2"

            # 20 GB virtual disk.
            VMSIZE="20G"

            # Use four build jobs.
            WORLD_FLAGS="-j4"
            KERNEL_FLAGS="-j4"
            EOF

            echo
            echo "release.conf:"
            cat "$GITHUB_WORKSPACE/work/release.conf"

            echo
            echo "========================================"
            echo " Check release.sh syntax"
            echo "========================================"

            /bin/sh -n release/release.sh

            echo
            echo "release.sh syntax OK"

            echo
            echo "========================================"
            echo " Build FreeBSD release"
            echo "========================================"

            export MAKE_JOBS=4

            /bin/sh release/release.sh \
              -c "$GITHUB_WORKSPACE/work/release.conf"

            echo
            echo "========================================"
            echo " Release build finished"
            echo "========================================"

            echo
            echo "Release files:"
            find "$GITHUB_WORKSPACE/work" \
              -type f \
              \( \
                -name "*.iso" \
                -o -name "*.img" \
                -o -name "*.qcow2" \
                -o -name "*.txz" \
                -o -name "MANIFEST" \
              \) \
              -print

            echo
            echo "========================================"
            echo " Create artifact directory"
            echo "========================================"

            mkdir -p "$GITHUB_WORKSPACE/work/artifacts"

            find "$GITHUB_WORKSPACE/work/src" \
              -maxdepth 3 \
              -type f \
              \( \
                -name "*.iso" \
                -o -name "*.img" \
                -o -name "*.qcow2" \
              \) \
              -exec cp -v {} "$GITHUB_WORKSPACE/work/artifacts/" \; \
              || true

            echo
            echo "Artifacts:"
            ls -lah "$GITHUB_WORKSPACE/work/artifacts" || true

      # ------------------------------------------------------------
      # Upload everything generated by the FreeBSD build.
      # ------------------------------------------------------------
      - name: Find build output
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo " Searching build output"
          echo "========================================"

          find . -type f \
            \( \
              -name "*.iso" \
              -o -name "*.img" \
              -o -name "*.qcow2" \
            \) \
            -print \
            | sort

      - name: Upload FreeBSD ISO
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-amd64-ISO
          path: |
            **/*.iso
          if-no-files-found: warn
          compression-level: 0

      - name: Upload FreeBSD IMG
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-amd64-IMG
          path: |
            **/*.img
          if-no-files-found: warn
          compression-level: 0

      - name: Upload FreeBSD QCOW2
        uses: actions/upload-artifact@v4
        with:
          name: FreeBSD-14.3-amd64-QCOW2
          path: |
            **/*.qcow2
          if-no-files-found: warn
          compression-level: 0
