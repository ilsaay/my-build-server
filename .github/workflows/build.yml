name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup D (DMD)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Show D version
        run: dmd --version

      - name: Build
        run: |
          mkdir bin
          dmd -O -release -of=bin\sysinfo.exe src\main.d

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-windows
          path: bin/sysinfo.exe
          if-no-files-found: error
