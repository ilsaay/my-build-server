name: Build DMD 1.076 Windows Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DMD 1.076 Windows
        shell: cmd
        run: |
          curl -L -o dmd.zip "https://downloads.dlang.org/releases/1.x/1.076/dmd.1.076.windows.zip"
          dir

      - name: Extract
        shell: cmd
        run: |
          mkdir dmd
          tar -xf dmd.zip -C dmd
          dir dmd

      - name: Remove non-Windows directories
        shell: cmd
        run: |
          cd dmd
          if exist freebsd rmdir /S /Q freebsd
          if exist linux rmdir /S /Q linux
          if exist osx rmdir /S /Q osx
          if exist html rmdir /S /Q html
          if exist man rmdir /S /Q man
          if exist samples rmdir /S /Q samples
          dir

      - name: Remove unnecessary files
        shell: cmd
        run: |
          cd dmd
          if exist windows\lib rmdir /S /Q windows\lib
          if exist windows\src rmdir /S /Q windows\src
          dir windows

      - name: Upload DMD Lite
        uses: actions/upload-artifact@v4
        with:
          name: dmd-1.076-windows-lite
          path: dmd
