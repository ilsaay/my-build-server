name: Build CompCert for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout CompCert
        uses: actions/checkout@v4
        with:
          repository: AbsInt/CompCert
          ref: v3.13.1
          fetch-depth: 1
          set-safe-directory: false

      - name: Set up Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: gcc make ocaml ocaml-findlib opam menhir
          install-dir: C:\tools\cygwin

      - name: Install Coq and dependencies via opam
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          # 用 yes 自动回答 opam init 的交互提示
          yes | opam init --disable-sandboxing -y
          opam switch create system ocaml-system.4.14.2
          eval $(opam env)
          opam update
          opam install coq.8.18.0 menhir -y

      - name: Configure CompCert for Cygwin
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          eval $(opam env)
          ./configure x86_64-cygwin -ignore-coq-version

      - name: Build CompCert
        shell: C:\tools\cygwin\bin\bash.exe --login -eo pipefail -o igncr '{0}'
        run: |
          eval $(opam env)
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: compcert-windows
          path: ./ccomp
