name: Build TinyCC 0.9.23 (Windows Native 32-bit)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-win32:
    # 切换至 Windows 运行者，使编译出来的 tcc.exe 可以直接在构建中运行
    runs-on: windows-latest

    steps:
      - name: 设置 MSYS2 32位编译环境
        uses: msys2/setup-msys2@v2
        with:
          msys2-location: C:\msys64
          update: true
          # 安装 32 位 MinGW 工具链、make 和 git
          install: git make mingw-w64-i686-toolchain

      - name: 从 GitHub 下载 TinyCC 0.9.23 源码
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch release_0_9_23 https://github.com/TinyCC/tinycc.git tcc-0.9.23

      - name: 配置并编译 TinyCC (Windows XP - 11 32位)
        shell: msys2 {0}
        run: |
          cd tcc-0.9.23
          # Windows 原生环境下配置 32 位编译，并锁定 XP 兼容性
          ./configure --cpu=x86 --extra-cflags="-O2 -D_WIN32_WINNT=0x0501 -m32"
          make

      - name: 打包编译产物
        shell: msys2 {0}
        run: |
          mkdir -p dist/tcc
          cp tcc-0.9.23/tcc.exe dist/tcc/
          cp -r tcc-0.9.23/include dist/tcc/
          cp -r tcc-0.9.23/lib dist/tcc/
          cd dist && zip -r ../tcc-0.9.23-win32.zip tcc

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tcc-0.9.23-win32-xp-11
          path: tcc-0.9.23-win32.zip
