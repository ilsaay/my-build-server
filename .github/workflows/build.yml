name: Build GCC Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Verify compilers
        run: |
          gcc --version
          gfortran --version

      - name: Check source files
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          echo "=== 当前目录 ==="
          pwd
          echo "=== 查找 hello.c ==="
          find . -name "hello.c" -print
          echo "=== 查找 hello.f90 ==="
          find . -name "hello.f90" -print
          echo "=== 全部文件 ==="
          find . -type f

      - name: Build C (C89)
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          if [ ! -f hello.c ]; then
            echo "错误：hello.c 不存在，请检查是否已提交到仓库"
            exit 1
          fi
          gcc -std=c89 -pedantic -o hello_c.exe hello.c

      - name: Build Fortran
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          if [ ! -f hello.f90 ]; then
            echo "错误：hello.f90 不存在，请检查是否已提交到仓库"
            exit 1
          fi
          gfortran -o hello_f.exe hello.f90

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            hello_c.exe
            hello_f.exe
          if-no-files-found: warn
