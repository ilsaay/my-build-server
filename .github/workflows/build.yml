name: Build TCC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y build-essential git
    
    - name: Get TCC source
      run: |
        git clone https://github.com/TinyCC/tinycc.git
        cd tinycc
        echo "Available versions:"
        git tag -l
        git checkout release_0_9_26
    
    - name: Build TCC
      run: |
        cd tinycc
        ./configure --prefix=$GITHUB_WORKSPACE/install
        make -j2
        make install
    
    - name: Test TCC version
      run: |
        # 使用 -v 而不是 --version
        $GITHUB_WORKSPACE/install/bin/tcc -v || \
        $GITHUB_WORKSPACE/install/bin/tcc -version || \
        echo "TCC built successfully (version option not available)"
    
    - name: Test compilation
      run: |
        echo '#include <stdio.h>
        int main() { printf("TCC works!\n"); return 0; }' > test.c
        $GITHUB_WORKSPACE/install/bin/tcc test.c -o test
        ./test
        echo "Compilation successful!"
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: tcc-0926
        path: $GITHUB_WORKSPACE/install
