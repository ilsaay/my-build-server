name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup D (DMD)
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd

      - name: Show D version
        run: dmd --version

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          dmd -O -release -of=bin/sysinfo.exe src/main.d
          if (-not (Test-Path "bin/sysinfo.exe")) {
            Write-Host "=== Build failed: bin/sysinfo.exe not found ==="
            Get-ChildItem -Recurse | Format-Table FullName
            exit 1
          }
          Write-Host "=== Build succeeded ==="
          Get-Item bin/sysinfo.exe | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-windows
          path: bin/sysinfo.exe
          if-no-files-found: error
