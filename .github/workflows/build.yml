# .github/workflows/build-tcc.yml
name: Build TCC 0.9.24

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget
    
    - name: Download TCC 0.9.24
      run: |
        # 尝试多个下载源
        wget https://download.savannah.gnu.org/releases/tinycc/tcc-0.9.24.tar.gz || \
        wget https://ftp.gnu.org/pub/gnu/savannah/tinycc/tcc-0.9.24.tar.gz || \
        wget https://mirrors.tuna.tsinghua.edu.cn/gnu/tinycc/tcc-0.9.24.tar.gz
        tar -xzf tcc-0.9.24.tar.gz
        ls -la tcc-0.9.24/
    
    - name: Configure
      run: |
        cd tcc-0.9.24
        ./configure --prefix=$GITHUB_WORKSPACE/tcc-install
    
    - name: Build
      run: |
        cd tcc-0.9.24
        make -j2
    
    - name: Install
      run: |
        cd tcc-0.9.24
        make install
    
    - name: Test
      run: |
        $GITHUB_WORKSPACE/tcc-install/bin/tcc --version
        echo '#include <stdio.h>
        int main() { printf("TCC works!\n"); return 0; }' > test.c
        $GITHUB_WORKSPACE/tcc-install/bin/tcc test.c -o test
        ./test
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: tcc-0924
        path: $GITHUB_WORKSPACE/tcc-install
