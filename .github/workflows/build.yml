name: Build FFmpeg 4.0 for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          yasm \
          nasm \
          pkg-config \
          wget \
          bzip2 \
          mingw-w64 \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64

    - name: Download FFmpeg 4.0 Source
      run: |
        wget https://ffmpeg.org/releases/ffmpeg-4.0.tar.bz2
        tar -xjf ffmpeg-4.0.tar.bz2
        mv ffmpeg-4.0 ffmpeg-src

    - name: Configure FFmpeg
      run: |
        cd ffmpeg-src
        ./configure \
          --prefix=../dist \
          --target-os=mingw32 \
          --arch=x86_64 \
          --cross-prefix=x86_64-w64-mingw32- \
          --pkg-config-flags="--static" \
          --enable-shared \
          --disable-static \
          --enable-gpl \
          --enable-version3 \
          --disable-doc \
          --disable-ffplay \
          --disable-ffprobe
      shell: bash

    - name: Compile and Install
      run: |
        cd ffmpeg-src
        # 🌟 核心绝招：创建一个假的 windres 替换脚本，完美骗过 Makefile
        # 当它试图编译 Windows 图标资源时，我们用 gcc 生成一个安全的空文件代替，彻底避开报错！
        echo '#!/bin/sh' > fake_windres.sh
        echo 'x86_64-w64-mingw32-gcc -c -x c /dev/null -o "$$3"' >> fake_windres.sh
        chmod +x fake_windres.sh
        
        # 编译时把 WINDRES 指向我们的假脚本
        make -j$(nproc) WINDRES=./fake_windres.sh
        make install
      shell: bash

    - name: Prepare Artifacts
      run: |
        mkdir -p ffmpeg-win64
        cp -r dist/bin ffmpeg-win64/
        cp -r dist/include ffmpeg-win64/
        cp -r dist/lib ffmpeg-win64/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-4.0-windows-x64
        path: ffmpeg-win64/
