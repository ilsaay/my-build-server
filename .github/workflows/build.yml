name: Build DMD 1.076 Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download DMD 1.076 Windows
        shell: cmd
        run: |
          curl -L -o dmd1076.zip "https://downloads.dlang.org/releases/1.x/1.076/dmd.1.076.windows.zip"
          dir

      - name: Extract
        shell: cmd
        run: |
          mkdir dmd1076
          tar -xf dmd1076.zip -C dmd1076
          dir dmd1076

      - name: Remove useless directories
        shell: cmd
        run: |
          cd dmd1076
          rmdir /S /Q freebsd 2>nul
          rmdir /S /Q linux 2>nul
          rmdir /S /Q osx 2>nul
          rmdir /S /Q html 2>nul
          rmdir /S /Q man 2>nul
          rmdir /S /Q samples 2>nul
          dir

      - name: Upload portable DMD
        uses: actions/upload-artifact@v4
        with:
          name: dmd-1.076-windows-portable
          path: dmd1076
