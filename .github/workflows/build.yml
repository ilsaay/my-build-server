name: Build TUIC v2 server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download TUIC source
        run: |
          wget https://github.com/tuic-protocol/tuic/archive/refs/tags/0.2.2.zip
          unzip 0.2.2.zip
          cd tuic-0.2.2
          
          echo "=== Source structure ==="
          ls -la
          find . -name "*.rs" -type f
          
          echo "=== Check for suspicious code ==="
          grep -r "backdoor\|shell\|exec\|command\|reverse" --include="*.rs" . | grep -v "test" || true

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true

      - name: Build TUIC server
        run: |
          cd tuic-0.2.2
          cargo build --release --bin tuic-server
          
          echo "=== Build complete ==="
          ls -lh target/release/tuic-server
          file target/release/tuic-server
          
          # 复制到 dist 目录
          mkdir -p dist
          cp target/release/tuic-server dist/
          
          # 检查二进制
          strings dist/tuic-server | grep -iE "backdoor|shell|exec|reverse|bind" | head -20 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuic-server-linux-amd64
          path: tuic-0.2.2/dist/tuic-server
