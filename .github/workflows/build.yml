# .github/workflows/build-gcc-container.yml
name: Build GCC 2.7.2.3 in Container

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04  # 或更老的版本
    
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          wget \
          texinfo \
          bison \
          flex \
          file
    
    - name: Download GCC
      run: |
        wget https://ftp.gnu.org/gnu/gcc/gcc-2.7.2.3.tar.gz
        tar -xzf gcc-2.7.2.3.tar.gz
    
    - name: Configure
      run: |
        cd gcc-2.7.2.3
        # 先尝试自动检测
        ./configure \
          --host=$(gcc -dumpmachine) \
          --build=$(gcc -dumpmachine) \
          --enable-languages=c \
          --disable-shared \
          --disable-threads \
          --disable-nls \
          --prefix=$GITHUB_WORKSPACE/install || \
        # 如果失败，使用 i686
        ./configure \
          --host=i686-pc-linux-gnu \
          --build=i686-pc-linux-gnu \
          --enable-languages=c \
          --disable-shared \
          --disable-threads \
          --disable-nls \
          --prefix=$GITHUB_WORKSPACE/install
    
    - name: Build
      run: |
        cd gcc-2.7.2.3
        make -j2
    
    - name: Install
      run: |
        cd gcc-2.7.2.3
        make install
    
    - name: Test
      run: |
        $GITHUB_WORKSPACE/install/bin/gcc --version
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: gcc-2723
        path: $GITHUB_WORKSPACE/install
