name: Build TUIC v2 musl static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download TUIC source
        run: |
          wget https://github.com/tuic-protocol/tuic/archive/refs/tags/0.2.2.zip
          unzip 0.2.2.zip

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static
        run: |
          cd tuic-0.2.2
          cargo build --release --target x86_64-unknown-linux-musl --bin tuic-server
          
          echo "=== Verify static ==="
          ldd target/x86_64-unknown-linux-musl/release/tuic-server || true
          file target/x86_64-unknown-linux-musl/release/tuic-server
          
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/tuic-server dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tuic-server-static
          path: tuic-0.2.2/dist/tuic-server
