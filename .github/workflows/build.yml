name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-ada
            mingw-w64-ucrt-x86_64-gprbuild

      - name: Show toolchain versions
        shell: msys2 {0}
        run: |
          gnat --version
          gprbuild --version

      - name: Build
        shell: msys2 {0}
        run: |
          gprbuild -P sysinfo.gpr -j0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysinfo-windows
          path: bin/main.exe
          if-no-files-found: error
