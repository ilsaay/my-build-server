name: Build DMD 1.076 Windows Lite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download DMD 1.076 Windows
        shell: cmd
        run: |
          curl -L -o dmd1076.zip "https://downloads.dlang.org/releases/1.x/1.076/dmd.1.076.windows.zip"
          dir

      - name: Extract
        shell: cmd
        run: |
          mkdir dmd1076
          tar -xf dmd1076.zip -C dmd1076
          dir dmd1076

      - name: Remove non-Windows directories
        shell: cmd
        run: |
          cd dmd1076
          if exist freebsd rmdir /S /Q freebsd
          if exist linux rmdir /S /Q linux
          if exist osx rmdir /S /Q osx
          if exist html rmdir /S /Q html
          if exist man rmdir /S /Q man
          if exist samples rmdir /S /Q samples
          dir

      - name: Remove unnecessary files in Windows dir
        shell: cmd
        run: |
          cd dmd1076\windows
          if exist lib rmdir /S /Q lib
          if exist src rmdir /S /Q src
          dir

      - name: Upload DMD 1.076 Windows Lite
        uses: actions/upload-artifact@v4
        with:
          name: dmd-1.076-windows-lite
          path: dmd1076
