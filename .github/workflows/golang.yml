name: Build Go 1.15 Windows x64 (No Download)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-go115-windows:
    runs-on: windows-2022

    steps:
      # 1. 下载 Go 1.15 Windows x64
      - name: Download Go 1.15
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.dev/dl/go1.15.15.windows-amd64.zip" -OutFile "go1.15.zip"
          Expand-Archive go1.15.zip -DestinationPath C:\go1.15

      # 2. 拉取 Go 源码（改成真实仓库地址！）
      - name: Clone Go source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ilsaay/真实仓库名.git src

      # 3. 查看源码结构
      - name: Inspect source
        shell: cmd
        run: |
          cd src
          dir /s /b *.go
          dir /s /b go.mod

      # 4. 编译
      - name: Build no-download exe
        shell: cmd
        run: |
          set PATH=C:\go1.15\go\bin;%PATH%
          set CGO_ENABLED=0
          set GOOS=windows
          set GOARCH=amd64
          set GOPROXY=off
          set GO111MODULE=on

          cd src
          rem 如果 main.go/go.mod 在 src 根目录：
          go build -tags "netgo osusergo" -ldflags "-s -w" -o ..\app.exe .

      # 5. 验证
      - name: Verify
        shell: pwsh
        run: |
          Get-Item app.exe | Format-List

      # 6. 打包
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path app.exe -DestinationPath app-win-x64.zip -Force

      # 7. 上传产物（不能用 actions/upload-artifact，用 Release API）
      - name: Upload to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用 GitHub API 创建 release 并上传 zip
          $tag = "build-${{ github.run_number }}"
          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          $body = @{
            tag_name = $tag
            name = $tag
            draft = $false
            prerelease = $true
          } | ConvertTo-Json

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" `
            -Method Post -Headers $headers -Body $body -ContentType "application/json"

          $uploadUrl = $release.upload_url -replace '\{.*\}', ''
          Invoke-RestMethod -Uri "$uploadUrl?name=app-win-x64.zip" `
            -Method Post -Headers $headers -InFile "app-win-x64.zip" -ContentType "application/zip"

          Write-Host "Uploaded to release $tag"
