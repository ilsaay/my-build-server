name: Build Go 1.15 Windows x64 (No Download)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-go115-windows:
    runs-on: windows-2022

    steps:
      # 1. 拉取仓库
      - name: Checkout
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ilsaay/my-build-server.git .

      # 2. 列出仓库内容（关键：先看有什么）
      - name: List repo contents
        shell: cmd
        run: |
          echo === 当前目录 ===
          cd
          echo === 所有文件 ===
          dir /s /b
          echo === 查找 go 文件 ===
          dir /s /b *.go
          echo === 查找 go.mod ===
          dir /s /b go.mod

      # 3. 下载 Go 1.15
      - name: Download Go 1.15
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.dev/dl/go1.15.15.windows-amd64.zip" -OutFile "go1.15.zip"
          Expand-Archive go1.15.zip -DestinationPath C:\go1.15

      # 4. 编译（等确认源码位置后再改这里）
      - name: Build no-download exe
        shell: cmd
        run: |
          set PATH=C:\go1.15\go\bin;%PATH%
          set CGO_ENABLED=0
          set GOOS=windows
          set GOARCH=amd64
          set GOPROXY=off
          set GO111MODULE=on

          rem 根据上一步的结果，改这里的路径
          rem 如果 go.mod 在根目录：
          go build -tags "netgo osusergo" -ldflags "-s -w" -o app.exe .

          rem 如果源码在子目录，比如 cmd\app：
          rem cd cmd\app
          rem go build -tags "netgo osusergo" -ldflags "-s -w" -o ..\..\app.exe .
