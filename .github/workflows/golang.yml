name: Build Go 1.15 Windows x64 (No Download)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-go115-windows:
    runs-on: windows-2022

    steps:
      # 1. 拉取你自己的仓库（不用 actions/checkout）
      - name: Checkout
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ilsaay/my-build-server.git .

      # 2. 下载 Go 1.15 Windows x64
      - name: Download Go 1.15
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.dev/dl/go1.15.15.windows-amd64.zip" -OutFile "go1.15.zip"
          Expand-Archive go1.15.zip -DestinationPath C:\go1.15

      # 3. 定位入口文件 + 确认工作目录
      - name: Locate entrypoint
        shell: cmd
        run: |
          echo === 当前目录 ===
          cd
          echo === 查找 main.go ===
          dir /s /b main.go
          echo === 查找 go.mod ===
          dir /s /b go.mod

      # 4. 编译：裁剪 + 关风险功能 + 禁止下载
      - name: Build no-download exe
        shell: cmd
        run: |
          set PATH=C:\go1.15\go\bin;%PATH%
          set CGO_ENABLED=0
          set GOOS=windows
          set GOARCH=amd64
          set GOPROXY=off
          set GO111MODULE=on

          rem 如果项目有 go.mod，用 vendor 模式；没有就注释掉下面这行
          set GOFLAGS=-mod=vendor

          rem 构建当前目录的包（. 表示当前目录），不要写 main.go
          go build -tags "netgo osusergo" -ldflags "-s -w" -o app.exe .

      # 5. 验证产物
      - name: Verify
        shell: pwsh
        run: |
          Get-Item app.exe | Format-List
          .\app.exe --version 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No --version flag, skipping" }

      # 6. 打包
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path app.exe -DestinationPath app-win-x64.zip -Force
          Get-Item app-win-x64.zip | Format-List

      # 7. 显示产物路径
      - name: Show artifact path
        shell: pwsh
        run: |
          Write-Host "Artifact: $PWD\app-win-x64.zip"
