name: Build Mumble 1.3.4 V2 Server (Portable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone Mumble 1.3.4
        run: |
          git clone -b 1.3.4 --depth 1 https://github.com/mumble-voip/mumble.git mumble-src
          echo "--- verify source ---"
          ls mumble-src/CMakeLists.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev \
            libboost-dev libssl-dev \
            libprotobuf-dev protobuf-compiler libprotoc-dev \
            libcap-dev libxi-dev libasound2-dev \
            libogg-dev libsndfile1-dev libopus-dev \
            libspeechd-dev libavahi-compat-libdnssd-dev \
            libxcb-xinerama0 libpoco-dev

      - name: Configure CMake
        run: |
          cd mumble-src
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dclient=OFF \
            -Doverlay=OFF \
            -Dice=OFF \
            -Dtests=OFF \
            -DCMAKE_UNITY_BUILD=ON

      - name: Build
        run: |
          cd mumble-src/build
          cmake --build . -j$(nproc)

      - name: Prepare portable package
        run: |
          mkdir -p package/lib
          cp mumble-src/build/murmur/murmur package/ 2>/dev/null || cp mumble-src/build/murmur package/murmur
          if [ -f mumble-src/build/murmur/murmur.ini ]; then
            cp mumble-src/build/murmur/murmur.ini package/
          elif [ -f mumble-src/scripts/murmur.ini ]; then
            cp mumble-src/scripts/murmur.ini package/
          fi

          # 复制动态链接库，排除系统基础库
          ldd package/murmur | grep "=> /" | awk '{print $3}' | \
            grep -v -E '^/(lib/x86_64-linux-gnu/(libc|libm|libpthread|libdl|librt|libgcc_s|libstdc\+\+))' | \
            xargs -I {} cp {} package/lib/ 2>/dev/null || true

      - name: Create ZIP archive
        run: |
          cd package
          zip -r ../mumble-1.3.4-server-portable.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumble-1.3.4-server-portable
          path: mumble-1.3.4-server-portable.zip
          retention-days: 30
