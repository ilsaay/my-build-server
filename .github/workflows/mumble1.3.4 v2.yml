name: Build Mumble 1.3.x V2 Server (Portable)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.3.*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 1.3.4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev \
            libboost-dev libssl-dev \
            libprotobuf-dev protobuf-compiler libprotoc-dev \
            libcap-dev libxi-dev libasound2-dev \
            libogg-dev libsndfile1-dev libopus-dev \
            libspeechd-dev libavahi-compat-libdnssd-dev \
            libxcb-xinerama0 libzeroc-ice-dev libpoco-dev

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -Dclient=OFF \
            -Doverlay=OFF \
            -Dice=OFF \
            -Dtests=OFF \
            -DCMAKE_UNITY_BUILD=ON

      - name: Build
        run: |
          cd build
          cmake --build . -j$(nproc)

      - name: Prepare portable package
        run: |
          mkdir -p package
          cp build/murmur/murmur package/ 2>/dev/null || cp build/murmur package/murmur
          cp build/murmur/murmur.ini package/ 2>/dev/null || true

          # 复制动态链接库
          mkdir -p package/lib
          ldd package/murmur | grep "=> /" | awk '{print $3}' | xargs -I {} cp {} package/lib/ 2>/dev/null || true

      - name: Create ZIP archive
        run: |
          cd package
          zip -r ../mumble-1.3.4-server-portable.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumble-1.3.4-server-portable
          path: mumble-1.3.4-server-portable.zip
          retention-days: 30
