name: Build Mumble 1.3.4 v2 Server (Portable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 使用 20.04 容器构建，降低 GLIBC 依赖版本，提高跨 Linux 发行版兼容性
    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential qt5-qmake qtbase5-dev \
            libboost-dev libssl-dev libprotobuf-dev protobuf-compiler \
            libcap-dev libasound2-dev libogg-dev libsndfile1-dev libopus-dev \
            libspeechd-dev libavahi-compat-libdnssd-dev \
            patchelf zip gawk

      - name: Clone Mumble 1.3.4
        run: |
          git clone -b 1.3.4 --depth 1 https://github.com/mumble-voip/mumble.git mumble-src

      - name: Configure and Build (QMake)
        run: |
          cd mumble-src
          # 仅编译服务端 (Murmur)，禁掉客户端与无用模块
          qmake -r main.pro CONFIG+="release no-client no-overlay no-ice"
          make -j$(nproc)

      - name: Prepare portable package
        run: |
          mkdir -p package/lib

          # 寻找编译出的服务端二进制文件 (通常为 murmurd)
          MURMUR_BIN=$(find mumble-src -name "murmurd" -o -name "murmur" | head -n 1)
          if [ -z "$MURMUR_BIN" ]; then
            echo "Error: Murmur binary not found!"
            exit 1
          fi
          cp "$MURMUR_BIN" package/murmurd

          # 复制默认配置文件
          if [ -f mumble-src/scripts/murmur.ini ]; then
            cp mumble-src/scripts/murmur.ini package/murmur.ini
          fi

          # 复制第三方动态依赖库（排除 libc/libm 等核心系统库）
          ldd package/murmurd | grep "=> /" | awk '{print $3}' | \
            grep -v -E '^/(lib|usr/lib)/x86_64-linux-gnu/(libc|libm|libpthread|libdl|librt|libgcc_s|libstdc\+\+|ld-linux)' | \
            xargs -I {} cp -L {} package/lib/ 2>/dev/null || true

          # 修改二进制文件的 RPATH，使其优先从 relative ./lib 加载依赖
          patchelf --set-rpath '$ORIGIN/lib' package/murmurd

          # 创建一键启动脚本
          cat << 'EOF' > package/start.sh
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          exec "$DIR/murmurd" -fg -ini "$DIR/murmur.ini" "$@"
          EOF
          chmod +x package/start.sh

      - name: Create ZIP archive
        run: |
          cd package
          zip -r ../mumble-1.3.4-server-portable.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumble-1.3.4-server-portable
          path: mumble-1.3.4-server-portable.zip
          retention-days: 30
