name: Build Mumble 1.3.4 V2 Client (Portable Pure)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Install minimal build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          # 显式安装 sqlite3 运行库及 Qt 对应绑定
          apt-get install -y \
            git build-essential qt5-qmake qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libqt5sql5-sqlite libsqlite3-0 \
            libboost-dev libssl-dev libprotobuf-dev protobuf-compiler \
            libcap-dev libasound2-dev libpulse-dev libogg-dev libsndfile1-dev libopus-dev \
            libspeex-dev libspeexdsp-dev libx11-dev libxi-dev \
            patchelf zip gawk file

      - name: Clone Mumble 1.3.4 and Submodules
        run: |
          git clone -b 1.3.4 --depth 1 --recurse-submodules https://github.com/mumble-voip/mumble.git mumble-src

      - name: Configure and Build (Purified QMake)
        run: |
          cd mumble-src
          qmake -r main.pro CONFIG+="release no-server no-ice no-overlay no-g15 no-speechd no-bonjour no-crash-report"
          make -j$(nproc)

      - name: Prepare portable package
        run: |
          # 1. 创建标准的 Qt 插件层级结构
          mkdir -p package/lib package/plugins/platforms package/plugins/imageformats package/plugins/sqldrivers
          
          # 2. 复制客户端主程序
          MUMBLE_BIN=$(find mumble-src -type f -name "mumble" -executable | head -n 1)
          if [ -z "$MUMBLE_BIN" ]; then
            echo "Error: Mumble client binary not found!"
            exit 1
          fi
          cp "$MUMBLE_BIN" package/mumble

          # 3. 复制 Qt 核心功能插件
          QT_PLUGIN_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          cp -L "$QT_PLUGIN_DIR"/platforms/libqxcb.so package/plugins/platforms/ 2>/dev/null || true
          cp -L "$QT_PLUGIN_DIR"/imageformats/libqsvg.so package/plugins/imageformats/ 2>/dev/null || true
          cp -L "$QT_PLUGIN_DIR"/sqldrivers/libqsqlite.so package/plugins/sqldrivers/ 2>/dev/null || true

          # 4. 【关键】显式强制复制系统 SQLite 运行库到 package/lib
          cp -L /usr/lib/x86_64-linux-gnu/libsqlite3.so* package/lib/ 2>/dev/null || true

          # 5. 递归扫描主程序及所有 Qt 插件的依赖，统一收集到 package/lib/
          ALL_TARGETS="package/mumble $(find package/plugins -type f -name "*.so*")"
          for target in $ALL_TARGETS; do
            ldd "$target" | grep "=> /" | awk '{print $3}' | \
              grep -v -E '^/(lib|usr/lib)/.*/(libc\.so|libm\.so|libpthread|libdl|librt|libgcc_s|libstdc\+\+|ld-linux|libX|libxcb|libGL|libEGL|libdrm)' | \
              xargs -I {} cp -L {} package/lib/ 2>/dev/null || true
          done

          # 6. 修正主程序的 RPATH
          patchelf --set-rpath '$ORIGIN/lib' package/mumble

          # 7. 修正 lib/ 目录下依赖库的 RPATH
          find package/lib -type f -name "*.so*" -exec patchelf --set-rpath '$ORIGIN' {} \; 2>/dev/null || true

          # 8. 修正 plugins/ 目录下所有插件的 RPATH，使其跨目录指向 ../../lib
          find package/plugins -type f -name "*.so*" -exec patchelf --set-rpath '$ORIGIN/../../lib:$ORIGIN/../lib' {} \; 2>/dev/null || true

          # 9. 生成标准的 qt.conf 配置文件
          cat << 'EOF' > package/qt.conf
          [Paths]
          Prefix = .
          Plugins = plugins
          Libraries = lib
          EOF

          # 10. 生成开箱即用的启动脚本
          cat << 'EOF' > package/start.sh
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/mumble" "$@"
          EOF
          chmod +x package/start.sh

      - name: Create ZIP archive
        run: |
          cd package
          zip -r ../mumble-1.3.4-client-pure-portable.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumble-1.3.4-client-pure-portable
          path: mumble-1.3.4-client-pure-portable.zip
          retention-days: 30
