name: Build Bilibili Bot

on:
  push:
    branches: [ main ]
    paths:
      - 'java/bilibili/**'
      - '.github/workflows/build-bilibili.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 编译为 Java 8 兼容字节码
        working-directory: java/bilibili
        run: |
          echo "=== 目录内容 ==="
          ls -la
          mkdir -p build
          javac --release 8 -encoding UTF-8 -d build Main.java
          echo "=== 编译产物 ==="
          find build -name '*.class'

      - name: 验证字节码版本 (应为 52 = Java 8)
        working-directory: java/bilibili
        run: |
          cd build
          MAJOR=$(od -An -tu1 -j6 -N2 Main.class | awk '{print $1*256+$2}')
          echo "字节码主版本号: $MAJOR (52 = Java 8)"
          [ "$MAJOR" -gt 52 ] && echo "❌ 不兼容 Java 8" && exit 1
          echo "✅ 兼容 Java 8+"

      - name: 打包为可执行 JAR
        working-directory: java/bilibili
        run: |
          cd build
          jar cfe ../bilibili-bot.jar Main Main.class
          cd ..
          jar tf bilibili-bot.jar
          unzip -p bilibili-bot.jar META-INF/MANIFEST.MF
          ls -lh bilibili-bot.jar

      - name: 上传 JAR 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-bot-jar
          path: java/bilibili/bilibili-bot.jar
          if-no-files-found: error

      - name: 生成版本号
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bilibili Bot ${{ steps.version.outputs.tag }}"
          body: |
            ## B站直播弹幕机器人
            - 字节码版本: Java 8 (兼容 JDK 8 ~ 21)
            ### 使用方法
            1. 下载 `bilibili-bot.jar`
            2. 同目录创建 `bilibili_config.ini`
            3. `java -jar bilibili-bot.jar`
            ```ini
            SESSDATA=xxx
            bili_jct=xxx
            DedeUserID=xxx
            ROOM_ID=123456
            KEYWORD_你好=你好呀~
