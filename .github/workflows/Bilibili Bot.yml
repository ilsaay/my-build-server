name: Compile Bilibili Danmaku Bot

on:
  push:
    branches:
      - main
    paths:
      - 'java/bilibili/**'
  pull_request:
    branches:
      - main
    paths:
      - 'java/bilibili/**'
  workflow_dispatch: # 允许手动触发工作流

jobs:
  build:
    name: Build with JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    
    # 矩阵测试：在多个 Java 版本下编译，验证兼容性
    strategy:
      matrix:
        java-version: ['8', '11', '17', '21']
      fail-fast: false # 某个版本失败不影响其他版本的测试结果

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置指定版本的 Java 环境
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin' # 使用 Eclipse Temurin (Adoptium) 发行版

      # 3. 创建输出目录
      - name: Create output directory
        run: mkdir -p java/bilibili/out

      # 4. 编译 Java 代码
      # 使用 -encoding UTF-8 防止中文注释报错
      # 代码无第三方依赖，直接编译单个文件即可
      - name: Compile Bilibili.java
        run: |
          echo "Compiling with Java $(java -version 2>&1 | head -n 1)"
          javac -encoding UTF-8 -d java/bilibili/out java/bilibili/Bilibili.java
          echo "Compilation successful!"

      # 5. (可选) 将编译好的 .class 文件打包为 Artifact 供下载
      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-bot-jdk-${{ matrix.java-version }}
          path: java/bilibili/out/
          retention-days: 7
          if-no-files-found: error
