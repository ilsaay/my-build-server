name: Build Bilibili Bot

on:
  push:
    branches: [ main ]
    paths:
      - 'java/bilibili/**'
      - '.github/workflows/build-bilibili.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 检查源码
        working-directory: java/bilibili
        run: |
          echo "=== 目录内容 ==="
          ls -la
          if [ ! -f main.java ]; then
            echo "❌ 找不到 main.java"
            exit 1
          fi
          # 检查类名是否为 main
          CLASS=$(grep -oP 'public\s+class\s+\K\w+' main.java | head -1)
          echo "public class: $CLASS"
          if [ "$CLASS" != "main" ]; then
            echo "❌ 类名是 '$CLASS', 但文件名是 main.java"
            echo "Java 要求 public 类名与文件名一致 (区分大小写)"
            echo "请把 'public class $CLASS' 改成 'public class main'"
            exit 1
          fi
          echo "✅ 类名与文件名匹配"

      - name: 编译为 Java 8 兼容字节码
        working-directory: java/bilibili
        run: |
          mkdir -p build
          javac --release 8 -encoding UTF-8 -d build main.java
          echo "=== 编译产物 ==="
          find build -name '*.class'

      - name: 验证字节码版本 (应为 52 = Java 8)
        working-directory: java/bilibili
        run: |
          cd build
          MAJOR=$(od -An -tu1 -j6 -N2 main.class | awk '{print $1*256+$2}')
          echo "字节码主版本号: $MAJOR (52 = Java 8)"
          if [ "$MAJOR" -gt 52 ]; then
            echo "❌ 字节码版本过高, 不兼容 Java 8"
            exit 1
          fi
          echo "✅ 兼容 Java 8+"

      - name: 打包为可执行 JAR
        working-directory: java/bilibili
        run: |
          cd build
          jar cfe ../bilibili-bot.jar main main.class
          cd ..
          echo "=== JAR 内容 ==="
          jar tf bilibili-bot.jar
          echo "=== MANIFEST ==="
          unzip -p bilibili-bot.jar META-INF/MANIFEST.MF
          ls -lh bilibili-bot.jar

      - name: 校验入口类和 class 数量
        working-directory: java/bilibili
        run: |
          MANIFEST=$(unzip -p bilibili-bot.jar META-INF/MANIFEST.MF)
          echo "$MANIFEST"
          if ! echo "$MANIFEST" | grep -q "Main-Class: main"; then
            echo "❌ 入口类错误! 期望 Main-Class: main"
            exit 1
          fi
          COUNT=$(jar tf bilibili-bot.jar | grep -c '\.class$')
          echo "class 文件数量: $COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "❌ jar 中 class 数量异常"
            jar tf bilibili-bot.jar | grep '\.class$'
            exit 1
          fi
          echo "✅ jar 校验通过"

      - name: 上传 JAR 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-bot-jar
          path: java/bilibili/bilibili-bot.jar
          if-no-files-found: error

      - name: 生成版本号
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Bilibili Bot ${{ steps.version.outputs.tag }}"
          body: |
            ## B站直播弹幕机器人

            - 源码: `java/bilibili/main.java`
            - 入口类: `main`
            - 字节码版本: Java 8 (兼容 JDK 8 ~ 21)

            ### 使用方法
            1. 下载 `bilibili-bot.jar`
            2. 在同目录创建 `bilibili_config.ini`
            3. 运行 `java -jar bilibili-bot.jar`

            ```ini
            SESSDATA=你的SESSDATA
            bili_jct=你的bili_jct
            DedeUserID=你的UID
            ROOM_ID=123456
            KEYWORD_你好=你好呀~
