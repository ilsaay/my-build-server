name: Build Rust 1.63.0 (rustc only, compat-first)

on:
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Rust version tag'
        required: false
        default: '1.63.0'
      bootstrap_version:
        description: 'Bootstrap Rust version'
        required: false
        default: '1.62.0'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: centos:7
      options: --user root

    steps:
      - name: Install system dependencies
        run: |
          yum install -y \
            gcc gcc-c++ make cmake3 python3 git curl \
            openssl-devel zlib-devel libffi-devel \
            which file tar gzip xz bzip2 patch \
            perl-core diffutils
          ln -sf /usr/bin/cmake3 /usr/bin/cmake || true
          ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: Checkout Rust source
        uses: actions/checkout@v4
        with:
          repository: rust-lang/rust
          ref: ${{ github.event.inputs.rust_version || '1.63.0' }}
          path: rust
          fetch-depth: 1

      - name: Install bootstrap Rust
        run: |
          export RUSTUP_HOME=/root/.rustup
          export CARGO_HOME=/root/.cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain ${{ github.event.inputs.bootstrap_version || '1.62.0' }} --profile minimal
          echo "$CARGO_HOME/bin" >> $GITHUB_PATH

      - name: Configure Rust build
        working-directory: rust
        run: |
          cat > config.toml <<'EOF'
          [build]
          build = "x86_64-unknown-linux-gnu"
          host = ["x86_64-unknown-linux-gnu"]
          target = ["x86_64-unknown-linux-gnu"]
          docs = false
          compiler-docs = false
          extended = true
          tools = ["rustc"]
          prefix = "/opt/rust-1.63.0"
          EOF

      - name: Build Rust (stage 2)
        working-directory: rust
        run: |
          ./x.py build --stage 2

      - name: Install to /opt/rust-1.63.0
        working-directory: rust
        run: |
          ./x.py install

      - name: Slim down (remove unused)
        run: |
          set -e
          PREFIX=/opt/rust-1.63.0
          cd "$PREFIX"

          # 删除工具
          rm -f bin/cargo bin/rustdoc bin/rustfmt bin/cargo-clippy bin/clippy-driver
          rm -f bin/rls bin/rust-analyzer
          rm -f bin/cargo-* bin/rust-*

          # 删除文档 / man
          rm -rf share/doc share/man

          # 删除源码
          rm -rf lib/rustlib/src

          # 删除测试
          rm -rf lib/rustlib/*/tests

          # 只保留本机 target
          cd lib/rustlib
          for d in */; do
            if [ "$d" != "x86_64-unknown-linux-gnu/" ] && [ "$d" != "etc/" ]; then
              rm -rf "$d"
            fi
          done

          # strip 二进制和动态库（不 strip .rlib）
          cd "$PREFIX"
          strip bin/rustc || true
          find lib -maxdepth 1 -name '*.so' -exec strip {} \; || true

      - name: Verify rustc
        run: |
          export PATH=/opt/rust-1.63.0/bin:$PATH
          rustc --version
          echo 'fn main(){println!("hello");}' > /tmp/t.rs
          rustc /tmp/t.rs -o /tmp/t
          /tmp/t

      - name: Package
        run: |
          cd /opt
          tar -czf rust-1.63.0-rustc-only-centos7.tar.gz rust-1.63.0
          ls -lh rust-1.63.0-rustc-only-centos7.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.63.0-rustc-only-centos7
          path: /opt/rust-1.63.0-rustc-only-centos7.tar.gz
          retention-days: 30
