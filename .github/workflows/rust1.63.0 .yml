name: Pure GitHub Actions Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点按钮手动触发编译

jobs:
  build-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust 1.63.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.63.0'
          targets: x86_64-unknown-linux-musl

      - name: Build & Optimize Binary
        # 直接通过环境变量注入所有体积裁剪和性能优化选项，无需改动 Cargo.toml
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'        # 优先优化二进制体积
          CARGO_PROFILE_RELEASE_LTO: 'true'          # 开启全局 LTO
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'   # 提升 LTO 优化效果
          CARGO_PROFILE_RELEASE_PANIC: 'abort'       # 剔除 unwind 展开代码
          RUSTFLAGS: '-C strip=symbols'              # 剥离所有调试符号
        run: |
          # --no-default-features 会自动剔除不必要的默认功能特性
          cargo build --release --target x86_64-unknown-linux-musl --no-default-features

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-static-binary
          # 提示：请将下面的 your_app_name 替换为你 Cargo.toml 里的 [package] name
          path: target/x86_64-unknown-linux-musl/release/your_app_name
