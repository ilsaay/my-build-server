name: Build JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Compile
        run: |
          mkdir -p out
          # 如果没有 package 声明，Main.java 直接编译：
          javac -encoding UTF-8 -d out src/Main.java
          # 如果有 package（例如 package com.ilsaay;），改成：
          # javac -encoding UTF-8 -d out src/com/ilsaay/Main.java

      - name: Create manifest
        run: |
          echo "Main-Class: Main" > manifest.txt
          # 如果有 package，改成：
          # echo "Main-Class: com.ilsaay.Main" > manifest.txt

      - name: Package into JAR
        run: |
          jar cfm my-build-server.jar manifest.txt -C out .

      - name: Show JAR contents
        run: jar tf my-build-server.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-build-server-jar
          path: my-build-server.jar
          retention-days: 30
