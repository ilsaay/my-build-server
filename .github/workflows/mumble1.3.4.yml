name: Build Mumble 1.3.4 Portable Minimal

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mumble 1.3.4
        uses: actions/checkout@v4
        with:
          repository: mumble-voip/mumble
          ref: 1.3.4
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config wget \
            qtbase5-dev qttools5-dev-tools libqt5svg5-dev libqt5sql5-sqlite \
            libasound2-dev libpulse-dev \
            protobuf-compiler libprotobuf-dev

      - name: Build OpenSSL 1.1.1 Static
        run: |
          wget https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure linux-x86_64 no-shared --prefix=/opt/openssl-1.1.1 -fPIC
          make -j$(nproc)
          sudo make install_sw

      - name: Configure Minimal Build
        env:
          OPENSSL_ROOT_DIR: /opt/openssl-1.1.1
          CMAKE_PREFIX_PATH: /opt/openssl-1.1.1
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -Dportable=ON \
            -Dtranslations=ON \
            -Doverlay=OFF \
            -Dplugins=OFF \
            -Dg15=OFF \
            -Dbonjour=OFF \
            -Ddbus=OFF \
            -Dupdate-check=OFF \
            -Dcrash-report=OFF \
            -Daudio-jack=OFF \
            -Daudio-speechd=OFF \
            -Dzeroconf=OFF \
            -Dserver=OFF \
            -Dgrpc=OFF \
            -DOPENSSL_USE_STATIC_LIBS=ON

      - name: Compile
        run: cmake --build build -j$(nproc)

      - name: Package Portable Bundle
        run: |
          mkdir -p dist/Data
          cp build/mumble dist/
          # 复制语言包（1.3.4 翻译文件通常在 build 目录或源码 translations 目录）
          if [ -d build/translations ]; then
            cp -r build/translations dist/
          elif [ -d translations ]; then
            mkdir -p dist/translations
            find translations -name "*.qm" -exec cp {} dist/translations/ \;
          fi
          touch dist/portable.ini
          cd dist && tar czf ../mumble-1.3.4-portable-minimal-linux-x86_64.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumble-1.3.4-portable-minimal
          path: mumble-1.3.4-portable-minimal-linux-x86_64.tar.gz
