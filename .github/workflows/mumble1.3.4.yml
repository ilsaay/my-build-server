name: Build Mumble 1.3.4 Portable Minimal

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Mumble 1.3.4 Source
        run: |
          git clone --depth 1 --branch 1.3.4 --recurse-submodules \
            https://github.com/mumble-voip/mumble.git mumble-src
          ls -la mumble-src/main.pro

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config wget \
            qtbase5-dev qttools5-dev-tools libqt5svg5-dev libqt5sql5-sqlite \
            libasound2-dev libpulse-dev \
            protobuf-compiler libprotobuf-dev \
            libspeexdsp-dev libopus-dev \
            libsndfile1-dev \
            libboost-dev

      - name: Build OpenSSL 1.1.1 Static
        run: |
          wget https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure linux-x86_64 no-shared --prefix=/opt/openssl-1.1.1 -fPIC
          make -j$(nproc)
          sudo make install_sw

      - name: Configure & Compile with qmake
        working-directory: mumble-src
        env:
          OPENSSL_ROOT: /opt/openssl-1.1.1
        run: |
          qmake main.pro \
            CONFIG+="release portable no-overlay no-plugins no-g15 no-bonjour no-dbus no-update-check no-crash-report no-jack no-speechd no-zeroconf no-grpc" \
            INCLUDEPATH+=/opt/openssl-1.1.1/include \
            LIBS+=-L/opt/openssl-1.1.1/lib \
            PREFIX=/usr

          make -j$(nproc)

      - name: Package Portable Bundle
        working-directory: mumble-src
        run: |
          mkdir -p dist/Data

          # 复制主二进制
          cp release/mumble dist/

          # 复制语言包
          if [ -d release/translations ]; then
            cp -r release/translations dist/
          elif [ -d translations ]; then
            mkdir -p dist/translations
            find . -name "*.qm" -exec cp {} dist/translations/ \; 2>/dev/null || true
          fi

          # 创建便携模式触发文件
          touch dist/portable.ini

          # 打包
          cd dist && tar czf ../../mumble-1.3.4-portable-minimal-linux-x86_64.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumble-1.3.4-portable-minimal
          path: mumble-1.3.4-portable-minimal-linux-x86_64.tar.gz
