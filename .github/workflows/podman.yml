name: Build Podman Static (Fixed GPGME)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Podman Version'
        required: true
        default: 'v5.2.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Podman Source
        uses: actions/checkout@v4
        with:
          repository: containers/podman
          ref: ${{ github.event.inputs.version }}
          path: podman-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libseccomp-dev libassuan-dev \
            libbtrfs-dev libdevmapper-dev pkg-config \
            gcc make git

      - name: Build Static Podman Binary
        run: |
          cd podman-src
          
          # 1. 清理之前的构建缓存，防止标签冲突
          go clean -cache
          
          # 2. 设置环境变量
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          export CGO_LDFLAGS="-static"
          export LDFLAGS="-extldflags '-static'"
          
          # 3. 关键：确保 disable_gpgme 在 tags 中
          # 注意：tags 之间用空格分隔
          export BUILDTAGS="exclude_graphdriver_btrfs exclude_graphdriver_devicemapper seccomp apparmor selinux disable_gpgme"
          
          echo "Building with tags: $BUILDTAGS"
          
          # 4. 执行编译
          make podman

      - name: Verify Binary
        run: |
          cd podman-src
          echo "=== File Info ==="
          file bin/podman
          echo "=== Dynamic Dependencies ==="
          ldd bin/podman || echo "✅ Success: Static or minimal dependencies."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-static-fixed
          path: podman-src/bin/podman
