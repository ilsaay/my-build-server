name: Build Podman Static Binary

on:
  workflow_dispatch: # 允许手动触发
    inputs:
      version:
        description: 'Podman Version'
        required: true
        default: 'v5.2.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Podman Source
        uses: actions/checkout@v4
        with:
          repository: containers/podman
          ref: ${{ github.event.inputs.version }}
          path: podman-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Podman 5.x 通常需要较新的 Go 版本

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev libgpgme-dev libassuan-dev libbtrfs-dev libdevmapper-dev pkg-config

      - name: Build Static Binary
        run: |
          cd podman-src
          # 设置环境变量以进行静态编译
          export CGO_ENABLED=1
          export BUILDTAGS="exclude_graphdriver_btrfs exclude_graphdriver_devicemapper seccomp"
          
          # 编译 podman 主程序
          make podman-static

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-static-linux-amd64
          path: podman-src/bin/podman
