name: Build Podman Static Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Podman Version'
        required: true
        default: 'v5.2.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Podman Source
        uses: actions/checkout@v4
        with:
          repository: containers/podman
          ref: ${{ github.event.inputs.version }}
          path: podman-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libseccomp-dev libgpgme-dev libassuan-dev \
            libbtrfs-dev libdevmapper-dev pkg-config \
            gcc make git

      - name: Build Static Podman Binary
        run: |
          cd podman-src
          
          # 关键：使用 CGO + 静态链接标志
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          
          # 静态链接的核心参数
          export LDFLAGS="-extldflags '-static'"
          
          # 排除不需要的存储驱动以减小体积和依赖
          export BUILDTAGS="exclude_graphdriver_btrfs exclude_graphdriver_devicemapper seccomp apparmor selinux"
          
          # 使用正确的 make 目标（podman 而非 podman-static）
          make podman LDFLAGS="$LDFLAGS" BUILDTAGS="$BUILDTAGS"
          
          # 验证是否为静态链接
          file bin/podman
          ldd bin/podman || echo "✅ 确认为静态二进制文件"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-static-linux-amd64
          path: podman-src/bin/podman
