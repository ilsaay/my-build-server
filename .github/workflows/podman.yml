name: Build Podman Static (No GPGME)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Podman Version'
        required: true
        default: 'v5.2.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Podman Source
        uses: actions/checkout@v4
        with:
          repository: containers/podman
          ref: ${{ github.event.inputs.version }}
          path: podman-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libseccomp-dev libassuan-dev \
            libbtrfs-dev libdevmapper-dev pkg-config \
            gcc make git

      - name: Build Static Podman Binary
        run: |
          cd podman-src
          
          # 核心配置：禁用 gpgme 并开启静态链接
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          export CGO_LDFLAGS="-static"
          export LDFLAGS="-extldflags '-static'"
          
          # 关键：加入 disable_gpgme
          export BUILDTAGS="exclude_graphdriver_btrfs exclude_graphdriver_devicemapper seccomp apparmor selinux disable_gpgme"
          
          # 执行编译
          make podman
          
          # 移动文件到根目录方便上传
          mv bin/podman ../podman-binary

      - name: Verify Binary
        run: |
          echo "=== File Info ==="
          file podman-binary
          echo "=== Dynamic Dependencies ==="
          ldd podman-binary || echo "✅ Success: No dynamic dependencies found or only libc remains."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-static-no-gpgme
          path: podman-binary
