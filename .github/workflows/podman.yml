name: Build Podman Static Binary (No GPGME)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Podman Version'
        required: true
        default: 'v5.2.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Podman Source
        uses: actions/checkout@v4
        with:
          repository: containers/podman
          ref: ${{ github.event.inputs.version }}
          path: podman-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 关键：重新加回 libgpgme-dev 仅用于通过编译检查
          # 最终二进制不会动态链接它
          sudo apt-get install -y \
            libseccomp-dev libgpgme-dev libassuan-dev \
            libbtrfs-dev libdevmapper-dev pkg-config \
            gcc make git

      - name: Build Static Podman Binary
        run: |
          cd podman-src
          
          # 清理缓存，防止旧标签残留
          go clean -cache
          
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          export CGO_LDFLAGS="-static"
          export LDFLAGS="-extldflags '-static'"
          
          # disable_gpgme + containers_image_openpgp 组合使用
          # openpgp 是 gpgme 的纯 Go 替代实现
          export BUILDTAGS="exclude_graphdriver_btrfs exclude_graphdriver_devicemapper seccomp apparmor selinux disable_gpgme containers_image_openpgp"
          
          echo "Building with tags: $BUILDTAGS"
          make podman
          
          echo "=== File Info ==="
          file bin/podman
          echo "=== Dynamic Dependencies ==="
          ldd bin/podman || echo "✅ Success: Static or minimal dependencies."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-static-no-gpgme
          path: podman-src/bin/podman
