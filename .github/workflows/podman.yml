name: Build Podman Static Binary (No GPGME)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Podman Version'
        required: true
        default: 'v5.2.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Podman Source
        uses: actions/checkout@v4
        with:
          repository: containers/podman
          ref: ${{ github.event.inputs.version }}
          path: podman-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 注意：这里已经删除了 libgpgme-dev
          sudo apt-get install -y \
            libseccomp-dev libassuan-dev \
            libbtrfs-dev libdevmapper-dev pkg-config \
            gcc make git

      - name: Build Static Podman Binary
        run: |
          cd podman-src
          
          # 清理缓存，确保新标签生效
          go clean -cache
          
          # 设置环境变量
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          export CGO_LDFLAGS="-static"
          export LDFLAGS="-extldflags '-static'"
          
          # 关键：加入 disable_gpgme
          export BUILDTAGS="exclude_graphdriver_btrfs exclude_graphdriver_devicemapper seccomp apparmor selinux disable_gpgme"
          
          echo "Building with tags: $BUILDTAGS"
          
          # 执行编译
          make podman
          
          # 验证结果
          echo "=== File Info ==="
          file bin/podman
          echo "=== Dynamic Dependencies ==="
          ldd bin/podman || echo "✅ Success: No dynamic dependencies found."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: podman-static-no-gpgme
          path: podman-src/bin/podman
