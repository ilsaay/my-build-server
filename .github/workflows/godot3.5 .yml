name: Build Godot 3.5 Linux x86_64 (2D focused)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            zlib1g-dev \
            libfreetype6-dev \
            libssl-dev \
            wget \
            unzip \
            zip \
            python3

      - name: Download Godot 3.5 source
        run: |
          wget https://github.com/godotengine/godot/archive/refs/tags/3.5-stable.tar.gz
          tar xzf 3.5-stable.tar.gz
          mv godot-3.5-stable godot

      - name: Build (2D focused)
        run: |
          cd godot
          scons -j$(nproc) \
            platform=x11 \
            target=release_debug \
            tools=no \
            use_llvm=no \
            use_static_cpp=yes \
            builtin_openssl=yes \
            builtin_freetype=yes \
            builtin_libpng=yes \
            builtin_zlib=yes \
            disable_3d=yes \
            module_bullet_enabled=no \
            module_csg_enabled=no \
            module_gridmap_enabled=no \
            module_mobile_vr_enabled=no \
            module_opensimplex_enabled=no \
            module_visual_script_enabled=no \
            module_webm_enabled=no \
            module_webp_enabled=no \
            module_thekla_unwrap_enabled=no \
            module_theora_enabled=no \
            module_tinyexr_enabled=no \
            module_squish_enabled=no \
            module_regex_enabled=yes \
            module_gdnative_enabled=yes \
            module_gdscript_enabled=yes \
            module_opus_enabled=no \
            module_vorbis_enabled=yes \
            module_mpc_enabled=no \
            module_pvr_enabled=no \
            module_upnp_enabled=no \
            module_websocket_enabled=no \
            module_mbedtls_enabled=no

      - name: Package
        run: |
          mkdir -p artifacts
          if [ -f godot/bin/godot.x11.opt.tools.64 ]; then
            cp godot/bin/godot.x11.opt.tools.64 artifacts/godot-3.5-linux-x86_64
          fi
          if [ -f godot/bin/godot.x11.opt.tools.32 ]; then
            cp godot/bin/godot.x11.opt.tools.32 artifacts/godot-3.5-linux-x86_32
          fi
          cd artifacts
          if [ -f godot-3.5-linux-x86_64 ]; then
            zip godot-3.5-linux-x86_64-2d.zip godot-3.5-linux-x86_64
          fi
          if [ -f godot-3.5-linux-x86_32 ]; then
            zip godot-3.5-linux-x86_32-2d.zip godot-3.5-linux-x86_32
          fi
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-3.5-linux-2d
          path: artifacts/
